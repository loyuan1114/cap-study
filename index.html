><td>細胞分裂與減數分裂、無性與有性生殖、植物的生殖。</td></tr>\n        <tr><td>第2章</td><td>遺傳</td><td>孟德爾遺傳法則、基因與染色體、遺傳諮詢與生物技術。</td></tr>\n        <tr><td>第3章</td><td>地球上的生物</td><td>生物分類、五界分類系統與病毒。</td></tr>\n        <tr><td>第4章</td><td>生態系</td><td>族群與群集、能量流動與物質循環、食物鏈與食物網。</td></tr>\n        <tr><td>第5章</td><td>人類與環境</td><td>人口問題、資源利用與環境汙染、生態保育。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"p2u\">\n    <h2 class=\"book\">二年級上（114）— 理化</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>基本測量</td><td>長度、質量、體積的測量與單位換算。</td></tr>\n        <tr><td>第2章</td><td>物質的世界</td><td>物質的分類、密度、三態變化與粒子模型。</td></tr>\n        <tr><td>第3章</td><td>波動與聲音</td><td>波的性質、聲波的產生與傳播、聲音的特性。</td></tr>\n        <tr><td>第4章</td><td>光</td><td>光的直進與反射折射、面鏡與透鏡成像。</td></tr>\n        <tr><td>第5章</td><td>溫度與熱</td><td>溫度與溫度計、熱量的傳播方式、比熱。</td></tr>\n        <tr><td>第6章</td><td>探索物質組成</td><td>原子與分子、元素與化合物、化學式與週期表。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"p2d\">\n    <h2 class=\"book\">二年級下（114）— 理化</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>化學反應</td><td>化學反應的類型、質量守恆、化學方程式與莫耳。</td></tr>\n        <tr><td>第2章</td><td>氧化與還原</td><td>氧化反應、活性大小比較、金屬的冶煉與防鏽。</td></tr>\n        <tr><td>第3章</td><td>電解質及酸鹼反應</td><td>電解質、酸鹼鹽、pH 值與酸鹼中和。</td></tr>\n        <tr><td>第4章</td><td>反應速率與平衡</td><td>影響反應速率的因素、可逆反應與平衡。</td></tr>\n        <tr><td>第5章</td><td>有機化合物</td><td>有機物的分類、常見有機物、聚合物與生活應用。</td></tr>\n        <tr><td>第6章</td><td>力與壓力</td><td>力的種類與測量、壓力與浮力。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"e3u\">\n    <h2 class=\"book\">三年級上（115）— 理化＋地科</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>直線運動</td><td>位移與路徑、速度與加速度、等加速運動。</td></tr>\n        <tr><td>第2章</td><td>力與運動</td><td>牛頓三大運動定律、摩擦力、圓周運動。</td></tr>\n        <tr><td>第3章</td><td>功與能</td><td>功的定義、動能與位能、能量守恆、簡單機械。</td></tr>\n        <tr><td>第4章</td><td>基本的靜電現象與電路</td><td>靜電、電壓電流電阻、串並聯電路、電功率。</td></tr>\n        <tr><td>第5章</td><td>水與陸地</td><td>水循環與地下水、地形作用、土壤。</td></tr>\n        <tr><td>第6章</td><td>板塊運動與地球歷史</td><td>板塊構造學說、地震與火山、地質年代。</td></tr>\n        <tr><td>第7章</td><td>運動中的天體</td><td>日月地系統、四季與晝夜、太陽系與恆星。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <a class=\"back\" href=\"index.html\">← 回總目錄</a>\n</div>\n</body>\n</html>", "英文-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>英文課本重點筆記（113–115）</title>\n<style>\n  :root{--bg:#f7f6f2;--card:#fff;--ink:#2a2a2a;--muted:#6b6b6b;--accent:#b0422e;--accent2:#1f6f5c;--line:#e5e2d8;}\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;}\n  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;}\n  header.top{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;}\n  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent);}\n  .sub{color:var(--muted);font-size:.95rem;}\n  nav.toc{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}\n  nav.toc a{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--accent2);font-size:.85rem;background:var(--card);}\n  nav.toc a:hover{border-color:var(--accent);color:var(--accent);}\n  h2.book{border-left:6px solid var(--accent);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;font-size:1.3rem;margin-top:40px;}\n  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;}\n  table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--card);font-size:.9rem;}\n  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}\n  th{background:#f1eee4;color:var(--accent2);}\n  .back{display:block;margin:40px 0 10px;color:var(--accent);text-decoration:none;}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>🇬🇧 英文課本重點筆記（113–115 翰林 iEnglish）</h1>\n    <div class=\"sub\">iE1–iE5 各冊 Unit 主題｜內容依各冊「Contents 課程大綱」核對</div>\n  </header>\n  <nav class=\"toc\">\n    <a href=\"#b1\">一年級上（iE1）</a><a href=\"#b2\">一年級下（iE2）</a><a href=\"#b3\">二年級上（iE3）</a><a href=\"#b4\">二年級下（iE4）</a><a href=\"#b5\">三年級上（iE5）</a>\n  </nav>\n\n  <section id=\"b1\">\n    <h2 class=\"book\">一年級上（iE1・113）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>Unit</th><th>主題</th><th>文法／重點</th></tr>\n        <tr><td>Starter</td><td>印刷體字母複習、複習國小英語</td><td>人稱代名詞主格/所有格、be 動詞直述句、What 問人名、How old 問年紀。</td></tr>\n        <tr><td>U1</td><td>Who's That Handsome Boy?（親屬・職業・人物特徵）</td><td>be 動詞直述/否定/Yes-No 問答、形容詞、Who 問句。</td></tr>\n        <tr><td>U2</td><td>Where Are My Pencils?（位置・房間）</td><td>指示詞 these/those、名詞複數、Where 問句。</td></tr>\n        <tr><td>R1</td><td colspan=\"2\">Review 1（複習一：聽力策略、統整、自我檢測）</td></tr>\n        <tr><td>U3</td><td>Open the Magic Door（圖像符號・建議與規範）</td><td>祈使句、Let's、助動詞 can 問答、人稱代名詞受格。</td></tr>\n        <tr><td>U4</td><td>What Time Is the Concert?（星期・時間）</td><td>What day 問星期、What time 問時間、現在進行式。</td></tr>\n        <tr><td>R2</td><td colspan=\"2\">Review 2</td></tr>\n        <tr><td>U5</td><td>What's the Date?（日期・月份・節慶）</td><td>What date 問日期、When 問句、序數。</td></tr>\n        <tr><td>U6</td><td>There Are Some Elephants Over There（旅遊・動物）</td><td>There is/are 問答、存在句。</td></tr>\n        <tr><td>R3</td><td colspan=\"2\">Review 3</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"b2\">\n    <h2 class=\"book\">一年級下（iE2・113）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>Unit</th><th>主題</th><th>文法／重點</th></tr>\n        <tr><td>CW</td><td>Cursive Writing</td><td>連續體（草寫）字母。</td></tr>\n        <tr><td>U1</td><td>What Do You Do in Your Free Time?（運動與休閒）</td><td>現在簡單式（一/二/三人稱單複數）、描述外觀、問身高。</td></tr>\n        <tr><td>U2</td><td>How Often Do You Go to the Library?（生活作息）</td><td>頻率副詞、How often 問頻率。</td></tr>\n        <tr><td>R1</td><td colspan=\"2\">Review 1</td></tr>\n        <tr><td>U3</td><td>Which Painting Do You Like?（藝術賞析・食物價錢）</td><td>Which 問句、How much 問價錢、不定代名詞 one/ones。</td></tr>\n        <tr><td>U4</td><td>How Much Flour Do You Need?（食物・食譜・數量）</td><td>How many/How much 問可數/不可數、because 和 so。</td></tr>\n        <tr><td>R2</td><td colspan=\"2\">Review 2</td></tr>\n        <tr><td>U5</td><td>There Was a Lot of Trash in the Sea（環境・自然）</td><td>be 動詞過去式、規則動詞過去式。</td></tr>\n        <tr><td>U6</td><td>I Took a Trip to India Last Month（旅遊・文化）</td><td>不規則動詞過去式。</td></tr>\n        <tr><td>R3</td><td colspan=\"2\">Review 3</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"b3\">\n    <h2 class=\"book\">二年級上（iE3・114／八上）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>Unit</th><th>主題</th><th>文法／重點</th></tr>\n        <tr><td>U1</td><td>How Was the Weather in Australia?（季節・天氣）</td><td>How/What 問天氣、授與動詞。</td></tr>\n        <tr><td>U2</td><td>You Can Learn About Game Design After You Join the Club（社團・學科）</td><td>從屬連接詞 after/before/when、所有格代名詞。</td></tr>\n        <tr><td>R1</td><td colspan=\"2\">Review 1</td></tr>\n        <tr><td>U3</td><td>Mom Was Doing the Dishes at Half Past Twelve（家事・睡眠）</td><td>過去進行式、過去進行式與過去式連用、時間逆讀法。</td></tr>\n        <tr><td>U4</td><td>What Do You Want to Be in the Future?（職業探索）</td><td>不定詞/動名詞當受詞、動名詞當主詞、虛主詞 it。</td></tr>\n        <tr><td>R2</td><td colspan=\"2\">Review 2</td></tr>\n        <tr><td>U5</td><td>How Do We Go to the Hotel?（旅行・交通）</td><td>交通方式、指示方向用語。</td></tr>\n        <tr><td>U6</td><td>I'll Take Two Pairs of Gloves（購物）</td><td>未來式、cost/spend/pay 花費、take/spend 花時間。</td></tr>\n        <tr><td>R3</td><td colspan=\"2\">Review 3</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"b4\">\n    <h2 class=\"book\">二年級下（iE4・114）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>Unit</th><th>主題</th><th>文法／重點</th></tr>\n        <tr><td>U1</td><td>The Steak Looks Yummy（點餐）</td><td>形容詞比較級、連綴動詞、as... as... 原級比較。</td></tr>\n        <tr><td>U2</td><td>Red Fire Ants Are the Most Dangerous Ants（戶外・交通安全）</td><td>形容詞最高級、反身代名詞。</td></tr>\n        <tr><td>R1</td><td colspan=\"2\">Review 1</td></tr>\n        <tr><td>U3</td><td>The Animals Work Hard（人權・動物）</td><td>情狀副詞、副詞比較級/最高級、使役動詞。</td></tr>\n        <tr><td>U4</td><td>I Can Hear the Wind Blow（颱風・搜救犬）</td><td>感官動詞、助動詞 should/must、if 子句。</td></tr>\n        <tr><td>R2</td><td colspan=\"2\">Review 2</td></tr>\n        <tr><td>U5</td><td>All of the Food Stands Look Great（病症・護理）</td><td>數量不定代名詞、although。</td></tr>\n        <tr><td>U6</td><td>You Can Throw a Ball, Can't You?（刻板印象）</td><td>附加問句、that 名詞子句。</td></tr>\n        <tr><td>R3</td><td colspan=\"2\">Review 3</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"b5\">\n    <h2 class=\"book\">三年級上（iE5・115）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>Unit</th><th>主題</th><th>文法／重點</th></tr>\n        <tr><td>U1</td><td>Have You Had Breakfast Yet?（健康・青少年煩惱）</td><td>現在完成式。</td></tr>\n        <tr><td>U2</td><td>The Movie Looks Exciting（版權・真偽資訊）</td><td>過去/現在分詞當形容詞、so... that...、enough to、too to。</td></tr>\n        <tr><td>R1</td><td colspan=\"2\">Review 1</td></tr>\n        <tr><td>U3</td><td>The Soldier Was Saved by a Dog（志工・動物英雄）</td><td>被動語態。</td></tr>\n        <tr><td>U4</td><td>Do You Know Where the File Is?（智慧住宅・AI）</td><td>wh- 名詞子句、wh- 不定詞片語、whether/if。</td></tr>\n        <tr><td>R2</td><td colspan=\"2\">Review 2</td></tr>\n        <tr><td>U5</td><td>The Man Who Shook Hands With Me Is My Favorite Star（漫畫展・名人）</td><td>介系詞片語後位修飾、關係子句（關係代名詞當主詞）。</td></tr>\n        <tr><td>U6</td><td>The Sign Which You Used Is Not OK（文化差異）</td><td>關係子句（當受詞）、所有格關係代名詞 whose。</td></tr>\n        <tr><td>R3</td><td colspan=\"2\">Review 3</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <p class=\"sub\" style=\"margin-top:18px\">全部五冊 Unit 主題與文法焦點，皆依各冊《Contents 課程大綱》逐單元核對。</p>\n  <a class=\"back\" href=\"index.html\">← 回總目錄</a>\n</div>\n</body>\n</html>", "講義測驗習作-資源總覽.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>講義・測驗卷・習作 資源總覽</title>\n<style>\n  :root{--bg:#f7f6f2;--card:#fff;--ink:#2a2a2a;--muted:#6b6b6b;--accent:#b0422e;--accent2:#1f6f5c;--line:#e5e2d8;}\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;}\n  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;}\n  header.top{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;}\n  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent);}\n  .sub{color:var(--muted);font-size:.95rem;}\n  nav.toc{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}\n  nav.toc a{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--accent2);font-size:.85rem;background:var(--card);}\n  nav.toc a:hover{border-color:var(--accent);color:var(--accent);}\n  h2.kind{border-left:6px solid var(--accent);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;font-size:1.3rem;margin-top:40px;}\n  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;}\n  table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--card);font-size:.9rem;}\n  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}\n  th{background:#f1eee4;color:var(--accent2);}\n  ul{margin:6px 0;padding-left:22px;} li{margin:3px 0;}\n  code{background:#efede4;border-radius:4px;padding:1px 5px;font-size:.85rem;}\n  .back{display:block;margin:40px 0 10px;color:var(--accent);text-decoration:none;}\n  .note{background:#fff8e8;border:1px solid #ecdfb9;border-radius:8px;padding:10px 14px;font-size:.9rem;color:#6b5b3a;}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>📚 講義・測驗卷・習作 資源總覽</h1>\n    <div class=\"sub\">會考題庫＋講義資料夾內的課外練習資源整理｜結構依實際 PDF 抽樣核對</div>\n  </header>\n  <nav class=\"toc\">\n    <a href=\"#quick\">速講義</a><a href=\"#quiz\">平時測驗卷</a><a href=\"#work\">習作</a><a href=\"#other\">其他小講義</a><a href=\"#use\">使用建議</a>\n  </nav>\n\n  <div class=\"note\">本頁是「資源地圖」：說明每一類教材長什麼樣、涵蓋哪些範圍、在資料夾哪裡、怎麼用。詳細的逐課重點整理可在對應科目的課本重點頁延伸。</div>\n\n  <section id=\"quick\">\n    <h2 class=\"kind\">一、翰林速講義（重點＋題庫）</h2>\n    <div class=\"block\">\n      <p><b>位置：</b><code>會考題庫+講義\\國文\\113~115\\上\\下\\翰林速講義\\</code>（學生／教師兩版，另有「未分類」的逐課單檔）</p>\n      <p><b>結構（已核對 113 上國文）：</b>每課含「重點整理 → 基礎篇 → 選擇篇 → 成語大進擊 → 進階篇 → 閱讀篇」，書末附全冊解答。整冊約 119 頁，是課外最重要的自修教材。</p>\n      <p><b>涵蓋：</b>國文（113 上/下、114 上/下、115 上）為主，各冊目次對應課本每一課＋自學選文＋語文常識。</p>\n      <p><b>學生版 vs 教師版：</b>教師版含完整解答與教學提示，作答前建議先用學生版。</p>\n    </div>\n  </section>\n\n  <section id=\"quiz\">\n    <h2 class=\"kind\">二、平時測驗卷</h2>\n    <div class=\"block\">\n      <p><b>位置：</b><code>會考題庫+講義\\國文\\113~115\\上\\下\\平時測驗卷\\學生|教師\\</code>；數學另有<code>平時測驗卷\\基礎|進階\\</code>與<code>習作練習卷\\</code></p>\n      <p><b>結構（已核對 113 下國文）：</b>每卷鎖定「單課範圍」（如第一課 聲音鐘），題型含：國字注音、解釋、改錯、配合題（成語）、單選題（讀音、字形、字義、成語運用、課文理解）。每卷約 1-4 頁。</p>\n      <p><b>用途：</b>最適合「每課上完後的小範圍測驗」，用來確認單課掌握度；數學分「基礎／進階」兩級，可按程度挑。</p>\n    </div>\n  </section>\n\n  <section id=\"work\">\n    <h2 class=\"kind\">三、習作（含教用版）</h2>\n    <div class=\"block\">\n      <p><b>位置：</b><code>pdfs\\習作\\</code> 依科目分（國文、數學、自然、英文），多為「教用習作」合併檔；自然習作再分學用/教用。</p>\n      <p><b>結構：</b>國文習作逐課含生字練習、形音義、課文理解與閱讀寫作；自然習作依課本章節（第1章、第2章…）；英文習作分「聽力」「讀寫」＋實力挑戰。</p>\n      <p><b>用途：</b>課本知識的「應用練習」，尤其國文閱寫雙饗、英文聽力練習卷是會考聽讀能力的直接訓練。</p>\n    </div>\n  </section>\n\n  <section id=\"other\">\n    <h2 class=\"kind\">四、其他小講義／補充</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>類型</th><th>內容</th><th>適用</th></tr>\n        <tr><td>絕句／近體詩小講義</td><td>詩體格律、詩選補充學習單</td><td>國文詩歌單元加深</td></tr>\n        <tr><td>題辭小講義</td><td>題辭、柬帖應用文</td><td>國文應用文考點</td></tr>\n        <tr><td>速講義（未分類逐課檔）</td><td>單課拆分的重點＋練習</td><td>只補單課弱點時使用</td></tr>\n        <tr><td>測驗卷-基礎/進階（數學）</td><td>同範圍兩級難度</td><td>依程度分級練習</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"use\">\n    <h2 class=\"kind\">五、使用建議</h2>\n    <div class=\"block\">\n      <ul>\n        <li><b>節奏：</b>每課流程 = 讀課本重點 → 寫速講義該課（重點＋基礎＋選擇）→ 寫平時測驗卷 → 錯題回課本。</li>\n        <li><b>段考前：</b>用速講義「成語大進擊＋進階篇」與習作綜合練習衝刺。</li>\n        <li><b>會考前：</b>回到「考古題重點整理」那頁練整套題本節奏。</li>\n        <li><b>資源檔大而多</b>（合併檔百頁上下）：建議按「未分類」逐課檔做，一次一課比較能消化。</li>\n      </ul>\n    </div>\n  </section>\n\n  <a class=\"back\" href=\"index.html\">← 回總目錄</a>\n</div>\n</body>\n</html>"};

function renderFiles(files) {
  let h = '<div class="file-grid">';
  for (const f of files) {
    const icon = (f.t === 'pdf' || f.t === 'html') ? '&#x1f4c4;' : '&#x1f4dd;';
    const cls = (f.t === 'pdf' || f.t === 'html') ? 'pdf' : 'doc';
    const name = f.n.replace(/\.[^.]+$/, '');
    let onclick;
    if (f.driveId) {
      onclick = `openDrive('${f.driveId}', true)`;
    } else if (f.drive && DRIVE_IDS[f.n]) {
      onclick = `openDrive('${DRIVE_IDS[f.n]}')`;
    } else if (f.t === 'html' && LOCAL_NOTES[f.n]) {
      onclick = `openNote('${f.n}')`;
    } else if (f.t === 'pdf' || f.t === 'html') {
      onclick = `window.open('${f.r}','_blank')`;
    } else {
      onclick = 'openDocx(this)';
    }
    const htmlAttr = f.t === 'docx' ? ` data-html="${escapeHtml(f.html)}"` : '';
    h += `<div class="file" onclick="${onclick}"${htmlAttr}><div class="file-icon ${cls}">${icon}</div><div class="file-info"><div class="file-name" title="${f.n}">${name}</div><div class="file-meta">.${f.t}</div></div><span class="go-sm">&#x203a;</span></div>`;
  }
  h += '</div>';
  return h;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openDocx(el) {
  const html = el.getAttribute('data-html');
  if (!html) return;
  current = {_type:'docx', name:'&#x67e5;&#x770b;&#x6a94;&#x6848;', html: html};
  render();
}

function openDrive(id, isFile) {
  let overlay = document.getElementById('driveOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'driveOverlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s';
    overlay.onclick = function(e) { if (e.target === overlay) closeDrive(); };
    document.body.appendChild(overlay);
  }
  const isKnownFile = isFile || Object.values(DRIVE_IDS).indexOf(id) !== -1;
  const src = isKnownFile
    ? `https://drive.google.com/file/d/${id}/preview`
    : `https://drive.google.com/embeddedfolderview?id=${id}`;
  overlay.innerHTML = `<div style="width:92vw;height:92vh;background:var(--bg2);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="display:flex;align-items:center;padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border);gap:10px">
      <span style="flex:1;font-weight:700;font-size:14px;color:var(--text)">&#x1f4c1; Google Drive</span>
      <button onclick="closeDrive()" style="padding:6px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;font-size:13px">&#x3275;&#x958b;</button>
    </div>
    <iframe src="${src}" style="flex:1;border:none;width:100%" allow="autoplay"></iframe>
  </div>`;
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.style.opacity = '1');
}

function openNote(key) {
  let overlay = document.getElementById('driveOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'driveOverlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s';
    overlay.onclick = function(e) { if (e.target === overlay) closeDrive(); };
    document.body.appendChild(overlay);
  }
  const title = key.replace(/\.html?$/i, '').replace(/&amp;/g, '&');
  overlay.innerHTML = `<div style="width:92vw;height:92vh;background:var(--bg2);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="display:flex;align-items:center;padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border);gap:10px">
      <span style="flex:1;font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">&#x1f4d2; ${escapeHtml(title)}</span>
      <button onclick="closeDrive()" style="padding:6px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;font-size:13px">&#x3275;&#x958b;</button>
    </div>
    <iframe id="noteFrame" style="flex:1;border:none;width:100%"></iframe>
  </div>`;
  document.getElementById('noteFrame').srcdoc = LOCAL_NOTES[key] || '';
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.style.opacity = '1');
}

function closeDrive() {
  const o = document.getElementById('driveOverlay');
  if (o) { o.style.opacity = '0'; setTimeout(() => o.style.display = 'none', 200); }
}

function countAll(arr) {
  let n = 0;
  for (const e of arr) {
    if (e.t === 'dir') n += countAll(e.c);
    else n += 1;
  }
  return n;
}

function navigate(cat) {
  current = {_type:'cat', name:cat, icon:DATA[cat].icon, c:DATA[cat].c};
  stack = [];
  render();
}

function openDir(name, gid) {
  const parent = current;
  stack.push({name:name, data:parent});
  const dir = parent.c.find(c => c.t === 'dir' && c.n === name && (!gid || c.driveId === gid));
  if (dir) {
    current = {_type:'dir', name:name, _cat:stack[0]?.name || '', c:dir.c};
    render();
  }
}

function goBack() {
  if (current._type === 'docx') {
    current = stack.pop();
    render();
    return;
  }
  if (stack.length === 0) {
    current = null;
    render();
    return;
  }
  const prev = stack.pop();
  current = prev.data;
  render();
}

function goHome() {
  current = null;
  stack = [];
  render();
}

function jumpTo(i) {
  while (stack.length > i + 1) stack.pop();
  const prev = stack.pop();
  current = prev.data;
  render();
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDrive(); });

render();
</script>
