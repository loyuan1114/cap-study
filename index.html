<script>(function(){
  var t=localStorage.getItem('theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
  window.toggleTheme=function(){
    var c=document.documentElement.getAttribute('data-theme');
    var n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  };
})();</script>
<style>
:root {
  --bg:#f1f3f9; --bg2:#fff; --bg3:#f7f8fd; --bg4:#e7eaf4;
  --text:#14152b; --text2:#5b6180; --text3:#9aa1bd;
  --accent:#6d5efc; --accent2:#8f86ff; --accent-glow:rgba(109,94,252,.12);
  --border:rgba(20,21,45,.08); --border-hover:rgba(109,94,252,.45);
  --card-bg:#fff; --card-shadow:0 1px 2px rgba(18,20,44,.05),0 12px 30px -18px rgba(18,20,44,.22);
  --hero-grad:linear-gradient(120deg,#6d5efc,#a06bff 50%,#ff6ea9);
  --topbar-bg:rgba(255,255,255,.78);
  --scrollbar:#c8cde2; --scrollbar-hover:#a4abca;
  --cat:#6d5efc; --cat2:#8f86ff; --cat-soft:rgba(109,94,252,.12); --cat-soft2:rgba(109,94,252,.05);
}
[data-theme="dark"] {
  --bg:#0c0d18; --bg2:#151728; --bg3:#1a1d32; --bg4:#252945;
  --text:#e9eaf7; --text2:#8d94b8; --text3:#585f88;
  --accent:#8577ff; --accent2:#aaa2ff; --accent-glow:rgba(133,119,255,.2);
  --border:rgba(255,255,255,.08); --border-hover:rgba(133,119,255,.5);
  --card-bg:#151729; --card-shadow:0 1px 2px rgba(0,0,0,.45),0 16px 36px -20px rgba(0,0,0,.8);
  --hero-grad:linear-gradient(120deg,#8577ff,#b48dff 50%,#ff7fb4);
  --topbar-bg:rgba(12,13,24,.82);
  --scrollbar:#2b3052; --scrollbar-hover:#3c4270;
  --cat:#8577ff; --cat2:#aaa2ff; --cat-soft:rgba(133,119,255,.2); --cat-soft2:rgba(133,119,255,.07);
}
/* category accents */
.c-hist{--cat:#ef3e5c;--cat2:#ff8095;--cat-soft:rgba(239,62,92,.12);--cat-soft2:rgba(239,62,92,.05)}
.c-book{--cat:#2f6df6;--cat2:#6ea3ff;--cat-soft:rgba(47,109,246,.12);--cat-soft2:rgba(47,109,246,.05)}
.c-work{--cat:#0cb27e;--cat2:#4bd8a6;--cat-soft:rgba(12,178,126,.12);--cat-soft2:rgba(12,178,126,.05)}
.c-qbank{--cat:#f08a00;--cat2:#ffc14d;--cat-soft:rgba(240,138,0,.14);--cat-soft2:rgba(240,138,0,.06)}
.c-note{--cat:#7c5cff;--cat2:#a896ff;--cat-soft:rgba(124,92,255,.13);--cat-soft2:rgba(124,92,255,.05)}
[data-theme="dark"] .c-hist{--cat:#ff5a75;--cat2:#ff93a5;--cat-soft:rgba(255,90,117,.16);--cat-soft2:rgba(255,90,117,.07)}
[data-theme="dark"] .c-book{--cat:#4d86ff;--cat2:#8ab5ff;--cat-soft:rgba(77,134,255,.16);--cat-soft2:rgba(77,134,255,.07)}
[data-theme="dark"] .c-work{--cat:#18c992;--cat2:#5ce6b8;--cat-soft:rgba(24,201,146,.16);--cat-soft2:rgba(24,201,146,.07)}
[data-theme="dark"] .c-qbank{--cat:#ffa224;--cat2:#ffcb6b;--cat-soft:rgba(255,162,36,.16);--cat-soft2:rgba(255,162,36,.07)}
[data-theme="dark"] .c-note{--cat:#9380ff;--cat2:#b8a9ff;--cat-soft:rgba(147,128,255,.18);--cat-soft2:rgba(147,128,255,.08)}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Outfit','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:radial-gradient(1000px 420px at 50% -160px,rgba(109,94,252,.10),transparent 70%),var(--bg);
  color:var(--text);min-height:100vh;transition:background .3s,color .3s
}
[data-theme="dark"] body{background:radial-gradient(1000px 420px at 50% -160px,rgba(133,119,255,.14),transparent 70%),var(--bg)}
::selection{background:rgba(109,94,252,.25)}
a{color:var(--accent2);text-decoration:none;transition:color .15s}a:hover{color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.topbar{background:var(--topbar-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;transition:background .3s}
.topbar .brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.logo-dot{width:32px;height:32px;border-radius:10px;background:var(--hero-grad);color:#fff;font-size:15px;font-weight:900;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(109,94,252,.75);flex-shrink:0}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:-.3px;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text2);padding:6px 13px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);transition:all .2s;cursor:pointer}
.topbar .back:hover{color:var(--accent);border-color:var(--border-hover);transform:scale(1.04)}
.theme-toggle{width:46px;height:25px;border-radius:13px;border:none;cursor:pointer;background:var(--bg4);position:relative;transition:background .3s;flex-shrink:0}
.theme-toggle::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#f1c40f;transition:transform .3s,background .3s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
[data-theme="dark"] .theme-toggle{background:var(--accent)}
[data-theme="dark"] .theme-toggle::after{transform:translateX(21px);background:#e8e8f5}

.container{max-width:1120px;margin:0 auto;padding:26px 24px 64px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero,.grid,.file-grid,.breadcrumb,.docx-viewer{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}


.breadcrumb{font-size:13px;color:var(--text3);margin-bottom:22px;display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:7px 14px;box-shadow:var(--card-shadow)}
.breadcrumb a{color:var(--text2);padding:3px 9px;border-radius:8px;transition:all .15s;font-weight:600;cursor:pointer}
.breadcrumb a:hover{color:var(--accent);background:var(--accent-glow)}
.breadcrumb .sep{color:var(--text3);font-size:11px;margin:0 2px}

h2{font-size:20px;font-weight:800;margin:4px 0 16px;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
h2::before{content:'';width:5px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--cat),var(--cat2));flex-shrink:0}

.hero{position:relative;overflow:hidden;text-align:center;padding:52px 28px 42px;border-radius:28px;background:linear-gradient(180deg,var(--cat-soft2),transparent 62%),var(--card-bg);border:1px solid var(--border);box-shadow:var(--card-shadow);margin-bottom:34px}
.hero .blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:drift 16s ease-in-out infinite}
.hero .b1{width:360px;height:360px;background:rgba(109,94,252,.32);top:-150px;left:-110px}
.hero .b2{width:320px;height:320px;background:rgba(255,110,169,.28);bottom:-160px;right:-90px;animation-delay:-8s}
[data-theme="dark"] .hero .b1{background:rgba(133,119,255,.3)}
[data-theme="dark"] .hero .b2{background:rgba(255,127,180,.24)}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-22px) scale(1.07)}66%{transform:translate(-26px,16px) scale(.95)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-emoji{font-size:38px;width:84px;height:84px;margin:0 auto 16px;display:grid;place-items:center;border-radius:26px;background:var(--cat-soft);box-shadow:0 12px 30px -14px var(--cat);animation:float 3.2s ease-in-out infinite;position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--accent);background:var(--accent-glow);border:1px solid rgba(109,94,252,.28);padding:6px 15px;border-radius:999px;margin-bottom:16px;position:relative}
.hero h2{display:block;text-align:center;margin-top:0;font-size:38px;font-weight:900;letter-spacing:-.8px;margin-bottom:10px;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative}
.hero h2::before{display:none}
.hero .sub{color:var(--text2);font-size:15px;line-height:1.8;margin-bottom:28px;font-weight:500;position:relative}
.hero .stat-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;position:relative}
.hero .stat-pill{background:var(--card-bg);border:1px solid var(--border);border-radius:40px;padding:10px 20px;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;transition:transform .2s,box-shadow .2s}
.hero .stat-pill:hover{transform:translateY(-3px);box-shadow:0 10px 24px -10px rgba(109,94,252,.4)}
.hero .stat-pill .num{font-weight:800;font-size:21px;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .stat-pill .lbl{color:var(--text2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;margin-bottom:34px}
.card{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:20px 18px;cursor:pointer;box-shadow:var(--card-shadow);transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,border-color .25s;overflow:hidden;user-select:none}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cat),var(--cat2));opacity:.85;transition:height .25s}
.card:hover{transform:translateY(-5px);border-color:var(--cat);box-shadow:0 20px 38px -20px var(--cat)}
.card:hover::before{height:4px}
.card .tile{width:54px;height:54px;border-radius:16px;background:var(--cat-soft);display:grid;place-items:center;font-size:26px;flex-shrink:0;transition:transform .25s}
.card:hover .tile{transform:scale(1.1) rotate(-5deg)}
.card .card-b{flex:1;min-width:0;padding-right:26px}
.card h3{font-size:16.5px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
.card .desc{font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:11px}
.card .count{font-size:12px;font-weight:700;color:var(--cat);background:var(--cat-soft);padding:5px 13px;border-radius:999px;display:inline-block}
.card .go{position:absolute;right:15px;top:50%;transform:translate(-6px,-50%);width:30px;height:30px;border-radius:50%;background:var(--cat-soft);color:var(--cat);display:grid;place-items:center;font-size:18px;font-weight:800;opacity:0;transition:all .25s}
.card:hover .go{opacity:1;transform:translate(0,-50%)}

.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:28px}
.file{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--card-shadow);transition:transform .22s,box-shadow .22s,border-color .22s;display:flex;align-items:center;gap:13px}
.file:hover{border-color:var(--cat);transform:translateY(-3px);box-shadow:0 16px 30px -18px var(--cat)}
.file-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--cat-soft);transition:transform .22s}
.file:hover .file-icon{transform:scale(1.1) rotate(-5deg)}
.file-info{flex:1;min-width:0}
.file-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--cat);background:var(--cat-soft);margin-top:5px;display:inline-block;padding:2px 9px;border-radius:7px;text-transform:uppercase}
.go-sm{width:26px;height:26px;border-radius:50%;background:var(--cat-soft);color:var(--cat);display:grid;place-items:center;font-size:15px;font-weight:800;opacity:0;transform:translateX(-6px);transition:all .22s;flex-shrink:0}
.file:hover .go-sm{opacity:1;transform:none}

.empty{color:var(--text3);text-align:center;padding:56px 20px;font-size:14.5px}
.docx-viewer{max-width:820px;margin:0 auto;line-height:1.95;font-size:15px}
.docx-viewer h1{font-size:26px;font-weight:800;margin:28px 0 14px}
.docx-viewer h2{font-size:21px;font-weight:700;margin:22px 0 10px;display:block}
.docx-viewer h2::before{display:none}
.docx-viewer h3{font-size:18px;font-weight:600;margin:16px 0 8px;color:var(--text2)}
.docx-viewer table{border-collapse:collapse;width:100%;margin:16px 0;border-radius:10px;overflow:hidden}
.docx-viewer td,.docx-viewer th{border:1px solid var(--border);padding:10px 14px;text-align:left;font-size:14px}
.docx-viewer th{background:var(--bg2);font-weight:700}

::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}
@media(max-width:640px){
  .container{padding:16px 14px 50px}
  .hero{padding:36px 16px 30px;border-radius:22px}
  .hero h2{font-size:27px;letter-spacing:-.4px}
  .hero-emoji{width:68px;height:68px;font-size:30px;border-radius:20px}
  .hero .stat-pill{padding:8px 14px;font-size:12.5px}
  .hero .stat-pill .num{font-size:17px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:16px 14px;gap:11px}
  .card .tile{width:46px;height:46px;font-size:22px;border-radius:14px}
  .file-grid{grid-template-columns:1fr}
  .topbar{padding:12px 14px;gap:10px}
  .badge{font-size:11px;padding:5px 12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let stack = [];
let current = null;
const CAT_CLASS = {'會考歷史題':'c-hist','課本':'c-book','習作':'c-work','會考題庫+講義':'c-qbank','重點筆記':'c-note'};

function render() {
  const app = document.getElementById('app');
  const title = document.getElementById('pageTitle');
  const back = document.getElementById('backBtn');
  app.className = 'container';

  if (!current) {
    title.textContent = '會考學習資料庫';
    back.style.display = 'none';
    let total = 0;
    for (const k in DATA) total += countAll(DATA[k].c);
    let html = `<div class="hero"><div class="blob b1"></div><div class="blob b2"></div><span class="hero-emoji">&#x1f4d6;</span><div class="badge">&#x1f3af; &#x570b;&#x4e2d;&#x6559;&#x80b2;&#x6703;&#x8003; &#xb7; &#x885d;&#x4e95;&#x5fc5;&#x5099;</div><h2>&#x6703;&#x8003;&#x5b78;&#x7fd2;&#x8cc7;&#x6599;&#x5eab;</h2><p class="sub">&#x6b77;&#x5c46;&#x8003;&#x984c; &#xd7; &#x8ab2;&#x672c; &#xd7; &#x7fd2;&#x4f5c; &#xd7; &#x984c;&#x5eab;&#x8b1b;&#x7fa9; &#xd7; &#x91cd;&#x9ede;&#x7b46;&#x8a18;<br>&#x4e00;&#x500b;&#x7db2;&#x9801;&#x5168;&#x90e8;&#x6410;&#x597d;&#xff0c;&#x8003;&#x524d;&#x885d;&#x4e95;&#x5c31;&#x9760;&#x5b83;</p><div class="stat-row"><div class="stat-pill"><span class="num">${total}</span><span class="lbl">&#x500b;&#x6a94;&#x6848;</span></div><div class="stat-pill"><span class="num">5</span><span class="lbl">&#x500b;&#x5b78;&#x79d1;</span></div><div class="stat-pill"><span class="num">5</span><span class="lbl">&#x500b;&#x5206;&#x985e;</span></div></div></div><div class="grid">`;
    for (const k in DATA) {
      const c = DATA[k];
      const n = countAll(c.c);
      let click;
      if (c.url) {
        click = `window.open('${c.url}','_blank')`;
      } else {
        click = `navigate('${k}')`;
      }
      const cls = CAT_CLASS[k] || '';
      html += `<div class="card ${cls}" onclick="${click}"><span class="tile">${c.icon}</span><div class="card-b"><h3>${k}</h3><div class="desc">${c.desc}</div><div class="count">${n} &#x500b;&#x6a94;&#x6848;</div></div><span class="go">&#x203a;</span></div>`;
    }
    html += `</div>`;
    app.innerHTML = html;
    return;
  }

  const path = stack.map(s => s.name).join(' › ');
  title.textContent = current.name || current.icon;
  back.style.display = current._type === 'cat' ? 'none' : 'inline-flex';

  let bc = '<a onclick="goHome()">&#x1f3e0; &#x9996;&#x9801;</a>';
  if (current._type === 'cat') {
    bc += `<span class="sep">›</span><a>${current.name}</a>`;
  } else if (current._type === 'dir') {
    const catName = stack.length && stack[0].data ? stack[0].data.name : current._cat;
    bc += `<span class="sep">›</span><a onclick="goHome()">${catName}</a>`;
    for (let i = 0; i < stack.length; i++) {
      const s = stack[i];
      if (i === stack.length - 1) {
        bc += `<span class="sep">›</span><a>${s.name}</a>`;
      } else {
        bc += `<span class="sep">›</span><a onclick="jumpTo(${i})">${s.name}</a>`;
      }
    }
  }

  let body = `<div class="breadcrumb">${bc}</div>`;

  if (current._type === 'cat') {
    const children = current.c;
    const dirs = children.filter(c => c.t === 'dir');
    const files = children.filter(c => c.t !== 'dir');
    if (dirs.length) {
      body += '<div class="grid">';
      for (const d of dirs) {
        const n = countAll(d.c);
        body += `<div class="card" onclick="openDir('${d.n}'${d.driveId ? `,'${d.driveId}'` : ''})"><span class="tile">&#x1f4c1;</span><div class="card-b"><h3>${d.n}</h3><div class="count">${n} &#x500b;&#x6a94;&#x6848;</div></div><span class="go">&#x203a;</span></div>`;
      }
      body += '</div>';
    }
    if (files.length) {
      body += `<h2>&#x1f4c4; &#x6a94;&#x6848; (${files.length})</h2>`;
      body += renderFiles(files);
    }
  } else if (current._type === 'dir') {
    const dirs = current.c.filter(c => c.t === 'dir');
    const files = current.c.filter(c => c.t !== 'dir');
    if (dirs.length) {
      body += '<div class="grid">';
      for (const d of dirs) {
        const n = countAll(d.c);
        body += `<div class="card" onclick="openDir('${d.n}'${d.driveId ? `,'${d.driveId}'` : ''})"><span class="tile">&#x1f4c1;</span><div class="card-b"><h3>${d.n}</h3><div class="count">${n} &#x500b;&#x6a94;&#x6848;</div></div><span class="go">&#x203a;</span></div>`;
      }
      body += '</div>';
    }
    if (files.length) {
      body += `<h2>&#x1f4c4; &#x6a94;&#x6848; (${files.length})</h2>`;
      body += renderFiles(files);
    }
    if (!dirs.length && !files.length) {
      body += '<div class="empty">&#x6b64;&#x5206;&#x985e;&#x4e0b;&#x7121;&#x6a94;&#x6848;</div>';
    }
  } else if (current._type === 'docx') {
    body += `<div class="docx-viewer">${current.html}</div>`;
  }

  const ck = current._type === 'cat' ? current.name : (stack.length && stack[0].data ? stack[0].data.name : null);
  if (ck && CAT_CLASS[ck]) app.classList.add(CAT_CLASS[ck]);
  app.innerHTML = body;
  window.scrollTo(0, 0);
}

ss=\"grid\">\n    <a class=\"card\" href=\"國文113上-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>國文 · 113上（一年級上）</h3>\n      <p>夏夜、背影、論語選、兒時記趣等課文與語文常識。</p>\n    </a>\n    <a class=\"card\" href=\"國文113下-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>國文 · 113下（一年級下）</h3>\n      <p>聲音鐘、紙船印象、五柳先生傳、石虎等課文與自學選文。</p>\n    </a>\n    <a class=\"card\" href=\"國文114上-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>國文 · 114上（二年級上）</h3>\n      <p>與115上課本篇目一致，連結至共同逐課重點。</p>\n    </a>\n    <a class=\"card\" href=\"國文114下-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>國文 · 114下（二年級下）</h3>\n      <p>木蘭詩、陋室銘、空城計、汨羅江神等課文。</p>\n    </a>\n    <a class=\"card\" href=\"國文115-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>國文 · 115上（二年級上）</h3>\n      <p>田園之秋選、古詩選、愛蓮說、張釋之執法等課文。</p>\n    </a>\n    <a class=\"card\" href=\"數學-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>數學 · 課本（113–115）</h3>\n      <p>一〜三年級各冊章節與核心重點。</p>\n    </a>\n    <a class=\"card\" href=\"社會-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>社會 · 課本（113–115）</h3>\n      <p>公民／地理／歷史三領域各年級課名與重點。</p>\n    </a>\n    <a class=\"card\" href=\"自然-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>自然 · 課本（113–115）</h3>\n      <p>生物、理化、地科各年級章節重點。</p>\n    </a>\n    <a class=\"card\" href=\"英文-重點筆記.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>英文 · 課本（113–115）</h3>\n      <p>iE1–iE5 全部單元主題與文法，依課程大綱核對。</p>\n    </a>\n  </div>\n\n  <h2>資料與考古題</h2>\n  <div class=\"grid\">\n    <a class=\"card\" href=\"會考考古題-重點整理.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>歷屆會考考古題重點</h3>\n      <p>110–115 年 5 科題型結構、命題取向與準備策略。</p>\n    </a>\n    <a class=\"card\" href=\"講義測驗習作-資源總覽.html\">\n      <div class=\"k ready\">已建立</div>\n      <h3>講義・測驗卷・習作總覽</h3>\n      <p>速講義、平時測驗卷、習作之結構與使用建議。</p>\n    </a>\n  </div>\n\n  <h2>說明</h2>\n  <ul>\n    <li>課本與講義內容依實際 PDF 翻頁核對（國文逐課、英文五冊課程大綱、講義測驗卷目次）；考古題總覽含翻頁核對的題本結構。</li>\n    <li>輸出檔案放在「重點筆記」資料夾，直接用瀏覽器開啟 index.html 即可瀏覽全部。</li>\n  </ul>\n  <p class=\"muted\">若要再細：可將某科逐課、逐題更深入，或調整版面配色，跟我說即可。</p>\n</div>\n</body>\n</html>", "國文113上-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>國文113上重點筆記</title>\n<style>\n:root{--bg:#f7f6f2;--card:#fff;--ink:#2b2b2b;--muted:#6b6b6b;--accent:#a9432d;--accent2:#1f6f5c;--line:#e5e2d8}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;line-height:1.85}.wrap{max-width:960px;margin:auto;padding:26px 20px 80px}header{border-bottom:3px solid var(--accent);padding-bottom:14px}h1{color:var(--accent);margin:0 0 4px;font-size:1.8rem}.sub{color:var(--muted);font-size:.93rem}nav{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);z-index:3}nav a{display:inline-block;margin:3px 5px 3px 0;padding:3px 9px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--accent2);text-decoration:none;font-size:.84rem}h2{margin-top:40px;padding:8px 12px;border-left:6px solid var(--accent);border-radius:0 8px 8px 0;background:var(--card);font-size:1.3rem}.meta,.block{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 18px;margin:12px 0}.meta b{color:var(--accent2)}h3{color:var(--accent2);font-size:1.03rem;border-bottom:2px solid var(--accent2);padding-bottom:3px;margin-top:0}ul{padding-left:22px;margin:7px 0}li{margin:3px 0}.tag{display:inline-block;background:#fdf0e6;color:#8b3b25;border-radius:5px;padding:1px 8px;font-size:.8rem;font-weight:bold;margin-right:5px}.note{background:#fff8e8;border:1px solid #ecdfb9;border-radius:8px;padding:9px 13px;color:#6b5b3a;font-size:.9rem}.back{display:block;margin-top:36px;color:var(--accent);text-decoration:none}\n</style>\n</head>\n<body><div class=\"wrap\">\n<header><h1>📖 國文113上（一年級上）重點筆記</h1><div class=\"sub\">依 113 上國中國文課本逐課題解、作者與學習重點整理</div></header>\n<nav><a href=\"#l01\">L01 夏夜</a><a href=\"#l02\">L02 無心的錯誤</a><a href=\"#l03\">L03 母親的教誨</a><a href=\"#yu1\">語一</a><a href=\"#l04\">L04 論語選</a><a href=\"#l05\">L05 背影</a><a href=\"#l06\">L06 心囚</a><a href=\"#yu2\">語二</a><a href=\"#l07\">L07 兒時記趣</a><a href=\"#l08\">L08 朋友相交</a><a href=\"#l09\">L09 音樂家與職籃巨星</a><a href=\"#l10\">L10 玫瑰淚</a></nav>\n\n<section id=\"l01\"><h2>第一課　夏夜 — 楊喚</h2><div class=\"meta\"><b>文體：</b>童詩　｜　<b>出處：</b>《楊喚全集》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>以童心描寫夏夜的寧靜、溫馨與活潑生機，帶讀者用視覺、聽覺感受自然之美。</li><li><span class=\"tag\">作者</span>楊喚，本名楊森，臺灣兒童文學先驅，童詩充滿童心童趣。</li><li><span class=\"tag\">寫法</span>大量運用擬人、想像、色彩與聲音描寫，把夏夜景物寫得有生命。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>童詩以兒童的內心世界與生活經驗為題材，語言淺顯、想像活潑。〈夏夜〉不只是在列舉景物，而是把夏夜的事物轉化成有情感、有動作的角色，形成寧靜中仍有生命流動的畫面。</p><p><b>必讀考點：</b>童詩特色、擬人法、朗誦時的節奏與聲情，以及視覺與聽覺摹寫。</p></div></section>\n\n<section id=\"l02\"><h2>第二課　無心的錯誤 — 劉墉</h2><div class=\"meta\"><b>文體：</b>說理散文　｜　<b>出處：</b>《超越自己》（二十週年紀念版）</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>「無心」不能成為犯錯的藉口；生活中若不看清題目、魯莽行事，可能造成嚴重後果。</li><li><span class=\"tag\">論證</span>透過生活與出題經驗舉例，說明做事要仔細、三思而後行。</li><li><span class=\"tag\">作者</span>劉墉，散文家、畫家，常以作品關懷與鼓勵青少年。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>文章以父親寫信給孩子的方式，從孩子因看錯考題而不滿談起，再用主持益智節目、課堂出題等例子說明：許多錯誤不是能力不足，而是「想當然」或沒有把題目看完。</p><p><b>寫作特色：</b>事例具體、說理淺近，採第二人稱對話語氣，兼具親切感與提醒作用。</p></div></section>\n\n<section id=\"l03\"><h2>第三課　母親的教誨 — 胡適</h2><div class=\"meta\"><b>文體：</b>回憶性散文　｜　<b>出處：</b>《四十自述》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>回憶母親在艱苦環境中對自己的管教與身教，表現深厚孺慕與感恩。</li><li><span class=\"tag\">人物</span>母親馮順弟堅忍持家、教子嚴明；胡適由母親身上學到待人處世的道理。</li><li><span class=\"tag\">寫法</span>具體細節、對話與諧音雙關，凸顯母親形象。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>胡適幼年喪父，由母親苦心教養。文章透過日常生活中的管教、待人與處世細節，寫出母親既嚴格又深情的教育方式；母親並不只教孩子讀書，也教他如何做人。</p><p><b>學習重點：</b>細節描寫如何塑造人物、對話如何表現性格，以及「言教」與「身教」對成長的影響。</p></div></section>\n\n<section id=\"yu1\"><h2>語文常識一　標點符號使用法</h2><div class=\"block\"><h3>📌 精簡重點</h3><ul><li>句號：完整語意的句末。逗號：語意尚未完整但需要停頓處。</li><li>問號用於疑問語氣；驚嘆號表驚訝、感嘆、命令等強烈語氣。</li><li>分號可分隔相關的分句；冒號常用於提示下文；引號標示引用或特殊語意。</li><li>標點不只是形式，也能協助讀者判讀語氣、層次與情感。</li></ul></div></section>\n\n<section id=\"l04\"><h2>第四課　論語選 — 孔子及弟子</h2><div class=\"meta\"><b>文體：</b>語錄　｜　<b>典籍：</b>《論語》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">內容</span>本課三則談孝親、為學持恆與自我反省，都是進德修業的重要道理。</li><li><span class=\"tag\">《論語》</span>孔子弟子與再傳弟子記錄孔子及時人言行，成書二十篇。</li><li><span class=\"tag\">核心</span>孝要有誠敬；學習不可半途而廢；每日反省自己的言行。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>孔子名丘、字仲尼，春秋魯國人，被尊為至聖先師。〈論語〉篇名通常取首章開頭數字。語錄文字短而意深，適合放回日常情境理解，不宜只背表面意思。</p><p><b>必讀考點：</b>「為山」與「平地」說明持之以恆；曾子的「三省吾身」說明反省；孝親不只供養，更重視態度與誠敬。</p></div></section>\n\n<section id=\"l05\"><h2>第五課　背影 — 朱自清</h2><div class=\"meta\"><b>文體：</b>記敘抒情散文　｜　<b>出處：</b>《背影》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>回憶父親在浦口送行時買橘子的背影，具體寫出深沉而含蓄的父愛。</li><li><span class=\"tag\">名場景</span>父親穿過鐵道、攀爬月臺為「我」買橘子，是全文情感核心。</li><li><span class=\"tag\">寫法</span>以背影為線索，運用細節、倒反與反覆，讓情感逐步累積。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>文章回憶祖母喪事後父親送「我」到浦口的往事。父親平時不善直接表達感情，卻從替孩子張羅行李、買橘子等行動展現關愛；多年後「我」讀到父親來信，才更深理解那個背影的意義。</p><p><b>必讀考點：</b>背影的象徵、父親動作的細節描寫、作者情感由不解到理解與感動的轉折。</p></div></section>\n\n<section id=\"l06\"><h2>第六課　心囚 — 杏林子</h2><div class=\"meta\"><b>文體：</b>勵志散文　｜　<b>出處：</b>《杏林小記》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>真正囚禁人的不一定是身體病痛，而可能是消極、悲觀與不健全的心理。</li><li><span class=\"tag\">作者</span>杏林子，本名劉俠，罹患類風溼關節炎，仍以創作與公益面對生命。</li><li><span class=\"tag\">寫法</span>正反對比：身體受限卻心靈自由，對照身體自由卻被心理困住的人。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>作者以自身長期病痛為背景，指出「心囚」才是更深的牢籠。身體的限制未必能奪走人的尊嚴、希望與行動力；相反地，若陷於自憐、懶惰或悲觀，即使身體健康，也可能失去真正的自由。</p><p><b>學習重點：</b>正向思考不是否認困難，而是在困境中仍選擇可行動的態度。</p></div></section>\n\n<section id=\"yu2\"><h2>語文常識二　閱讀導航：策略運用與資訊檢索</h2><div class=\"block\"><h3>📌 重點</h3><ul><li>先由篇名與關鍵詞提出 What／Why／How 問題，再回到文章找答案。</li><li>閱讀段落時抓重要訊息，歸納段旨，再統整全文主旨與自己的啟發。</li><li>資訊檢索要先確認問題、選擇適當關鍵詞、比較來源可信度，再整理答案。</li><li>連續性文本與圖表、網頁等非連續性文本，閱讀方法要配合資料形式調整。</li></ul></div></section>\n\n<section id=\"l07\"><h2>第七課　兒時記趣 — 沈復</h2><div class=\"meta\"><b>文體：</b>自傳性散文　｜　<b>出處：</b>《浮生六記》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>以敏銳觀察與豐富想像，把日常小事變成奇趣世界。</li><li><span class=\"tag\">名段</span>觀蚊如鶴、以叢草為森林、以蟲蟻為獸，展現兒童想像力。</li><li><span class=\"tag\">寫法</span>誇飾、比喻、擬人與細節觀察，使平凡景物變得新奇。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>沈復字三白，清代蘇州人。文章回憶童年，說明生活樂趣不一定來自珍貴玩具，而可由觀察與想像創造。閱讀時要掌握「物外之趣」：不是景物真的改變，而是作者的觀看方式改變。</p></div></section>\n\n<section id=\"l08\"><h2>第八課　朋友相交 — 琹涵</h2><div class=\"meta\"><b>文體：</b>說理散文　｜　<b>出處：</b>《詩情快意：對飲唐詩，發現生活真趣》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>交友貴在誠信，擇友應重品德，不可只看表面或一時利益。</li><li><span class=\"tag\">論證</span>引用詩文名句與成語，說明朋友類型與深淺交情。</li><li><span class=\"tag\">實踐</span>先成為值得信任的人，再期待遇到真正的朋友。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>琹涵本名鄭頻，作品常以平易文字談生活。本文將交友觀念放在詩文與成語中說明，列出泛泛之交、患難之交、莫逆之交等不同關係，提醒青年慎選朋友、以品德與誠信作為交往基礎。</p></div></section>\n\n<section id=\"l09\"><h2>第九課　音樂家與職籃巨星 — 王溢嘉</h2><div class=\"meta\"><b>文體：</b>書信式說理散文　｜　<b>出處：</b>《蟲洞書簡》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>魯賓斯坦與麥可・喬丹的成功都來自長期苦練，而不只是天分。</li><li><span class=\"tag\">論證</span>以不同領域的名人事例歸結相同道理，增強說服力。</li><li><span class=\"tag\">態度</span>把練習視同正式表現，持續累積，才能把能力轉化為成果。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>作者假想以「蟲洞」穿越時空，寫信給年輕的自己。文章把音樂家與職籃巨星放在一起比較，兩人的領域不同，卻都靠反覆練習、全力以赴與不輕忽細節而成功。</p></div></section>\n\n<section id=\"l10\"><h2>第十課　玫瑰淚 — 威廉斯・科貝爾著／張子樟譯</h2><div class=\"meta\"><b>文體：</b>翻譯小說（閱讀樂園）</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">閱讀焦點</span>留意小男孩的母親、妹妹與家庭處境，從人物行動推論情感。</li><li><span class=\"tag\">情感</span>以購買耶誕禮物的情節引出親情、失去與感傷。</li><li><span class=\"tag\">閱讀策略</span>把人物的動作、語氣與選擇連起來，推論沒有直接說出的背景。</li></ul></div><div class=\"block\"><h3>📝 詳實筆記</h3><p>課文開頭寫「我」急著到百貨公司挑選耶誕禮物，遇見抱著洋娃娃的小男孩。閱讀時應特別找出關於男孩母親與妹妹處境的句子，理解故事如何透過物品與人物行動呈現親情的重量。</p><p class=\"note\">本課為閱讀樂園翻譯作品，重點放在情節推論與人物心情，不宜只背表面情節。</p></div></section>\n\n<a class=\"back\" href=\"index.html\">← 回總目錄</a></div></body></html>", "國文113下-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"><title>國文113下重點筆記</title><style>\n:root{--bg:#f7f6f2;--card:#fff;--ink:#2b2b2b;--muted:#6b6b6b;--accent:#a9432d;--accent2:#1f6f5c;--line:#e5e2d8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;line-height:1.85}.wrap{max-width:960px;margin:auto;padding:26px 20px 80px}header{border-bottom:3px solid var(--accent);padding-bottom:14px}h1{color:var(--accent);margin:0 0 4px;font-size:1.8rem}.sub{color:var(--muted);font-size:.93rem}nav{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);z-index:3}nav a{display:inline-block;margin:3px 5px 3px 0;padding:3px 9px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--accent2);text-decoration:none;font-size:.84rem}h2{margin-top:40px;padding:8px 12px;border-left:6px solid var(--accent);border-radius:0 8px 8px 0;background:var(--card);font-size:1.3rem}.meta,.block{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 18px;margin:12px 0}.meta b{color:var(--accent2)}h3{color:var(--accent2);font-size:1.03rem;border-bottom:2px solid var(--accent2);padding-bottom:3px;margin-top:0}ul{padding-left:22px;margin:7px 0}li{margin:3px 0}.tag{display:inline-block;background:#fdf0e6;color:#8b3b25;border-radius:5px;padding:1px 8px;font-size:.8rem;font-weight:bold;margin-right:5px}.note{background:#fff8e8;border:1px solid #ecdfb9;border-radius:8px;padding:9px 13px;color:#6b5b3a;font-size:.9rem}.back{display:block;margin-top:36px;color:var(--accent);text-decoration:none}\n</style></head><body><div class=\"wrap\"><header><h1>📖 國文113下（一年級下）重點筆記</h1><div class=\"sub\">依 113 下國中國文課本逐課題解、作者與學習重點整理</div></header><nav><a href=\"#l01\">L01 聲音鐘</a><a href=\"#l02\">L02 孩子的鐘塔</a><a href=\"#l03\">L03 紙船印象</a><a href=\"#yu1\">語一</a><a href=\"#l04\">L04 小詩選</a><a href=\"#l05\">L05 近體詩</a><a href=\"#l06\">L06 石虎</a><a href=\"#yu2\">語二</a><a href=\"#l07\">L07 五柳先生傳</a><a href=\"#l08\">L08 鳳梨酥</a><a href=\"#l09\">L09 謝天</a><a href=\"#l10\">L10 貓的天堂</a><a href=\"#self\">自學</a></nav>\n\n<section id=\"l01\"><h2>第一課　聲音鐘 — 陳黎</h2><div class=\"meta\"><b>出處：</b>《陳黎跨世紀散文選》｜<b>文體：</b>生活觀察散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>把不同時段小販的叫賣聲比喻為「聲音鐘」，從聲音感受時間、季節與市井生活。</li><li><span class=\"tag\">寫法</span>以聽覺描寫為主，寫聲音的節奏、音調與地方特色。</li><li><span class=\"tag\">考點</span>外來語、臺灣鄉土文化、聲音如何承載記憶與人情。</li></ul></div></section>\n<section id=\"l02\"><h2>第二課　孩子的鐘塔 — 李黎</h2><div class=\"meta\"><b>出處：</b>《尋找紅氣球》｜<b>核心：</b>尼可拉斯效應與器官捐贈</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>格林夫婦將喪子之痛轉化為捐贈器官、幫助他人的大愛，重新思考生命的延續。</li><li><span class=\"tag\">作者</span>李黎，作品常在簡潔敘事中蘊含深遠的人道關懷。</li><li><span class=\"tag\">考點</span>「尼可拉斯效應」指器官捐贈讓生命與愛延續，化小愛為大愛。</li></ul></div></section>\n<section id=\"l03\"><h2>第三課　紙船印象 — 洪醒夫</h2><div class=\"meta\"><b>出處：</b>《洪醒夫全集》｜<b>文體：</b>回憶性散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>回憶童年母親摺紙船的溫暖，並希望把同樣的愛傳給下一代。</li><li><span class=\"tag\">象徵</span>紙船是母愛、童年記憶與親情傳承的具體象徵。</li><li><span class=\"tag\">寫法</span>以具體物件寄託抽象感情，並運用排比增強情感。</li></ul></div></section>\n<section id=\"yu1\"><h2>語文常識一　漢字的結構</h2><div class=\"block\"><h3>📌 重點</h3><ul><li>四種基本造字法：象形、指事、會意、形聲。</li><li>象形、指事屬獨體；會意、形聲屬合體。</li><li>《說文解字》是研究漢字形、音、義與部首分類的重要工具書。</li></ul></div></section>\n<section id=\"l04\"><h2>第四課　小詩選 — 艾青、白靈</h2><div class=\"meta\"><b>選詩：</b>〈跳水〉艾青、〈風箏〉白靈｜<b>文體：</b>現代小詩</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">小詩特色</span>篇幅短小，通常十行以下、百字以內，卻能以精巧意象傳達豐富情感。</li><li><span class=\"tag\">跳水</span>以跳水動作與姿態表現青春活力、專注與對理想的投入。</li><li><span class=\"tag\">風箏</span>從風箏意象聯想到追尋、牽引、自由與成長。</li></ul></div></section>\n<section id=\"l05\"><h2>第五課　近體詩選</h2><div class=\"meta\"><b>選詩：</b>〈登鸛雀樓〉王之渙、〈聞官軍收河南河北〉杜甫、〈過華清宮〉杜牧</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">體例</span>近體詩成熟於唐代，包含絕句與律詩，重視字數、押韻、平仄與對仗。</li><li><span class=\"tag\">登鸛雀樓</span>由登樓望遠發出「欲窮千里目，更上一層樓」的積極進取。</li><li><span class=\"tag\">聞官軍收河南河北</span>寫聞捷後的狂喜與歸鄉心情，情感奔放。</li><li><span class=\"tag\">過華清宮</span>以荔枝進貢諷刺統治者的奢侈與勞民傷財。</li></ul></div></section>\n<section id=\"l06\"><h2>第六課　石虎是我們的龍貓 — 劉克襄</h2><div class=\"meta\"><b>出處：</b>《自由時報電子報》｜<b>文體：</b>生態報導／議論散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>石虎是臺灣生態環境的重要指標，應保護瀕危動物與棲地。</li><li><span class=\"tag\">比喻</span>把石虎比作臺灣的龍貓，降低理解門檻，也突出生態守護者的意義。</li><li><span class=\"tag\">寫法</span>結合科學資料、觀察與建議，兼具理性、感性與行動呼籲。</li></ul></div></section>\n<section id=\"yu2\"><h2>語文常識二　漢字的流變與書法欣賞</h2><div class=\"block\"><h3>📌 重點</h3><ul><li>漢字字體演變大致為甲骨文、金文、篆書、隸書、楷書，另有行書、草書等書體。</li><li>隸書改變篆書的圓轉筆勢，楷書形體端整，行書與草書則更重視書寫速度與藝術表現。</li><li>欣賞匾額或碑帖時，要注意閱讀方向、字體與書寫風格。</li></ul></div></section>\n<section id=\"l07\"><h2>第七課　五柳先生傳 — 陶淵明</h2><div class=\"meta\"><b>文體：</b>自傳性傳記散文　｜　<b>出處：</b>《陶淵明集》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>託名五柳先生自傳，表現不慕榮利、任真自得、安貧樂道的品格。</li><li><span class=\"tag\">人物</span>陶淵明厭惡政治腐敗，辭官歸隱，被稱為隱逸詩人之宗。</li><li><span class=\"tag\">寫法</span>仿史傳筆法，以名號、性格、嗜好、志趣與評論刻畫人物。</li></ul></div></section>\n<section id=\"l08\"><h2>第八課　摩登土產鳳梨酥 — 洪愛珠</h2><div class=\"meta\"><b>出處：</b>《老派少女購物路線》｜<b>文體：</b>飲食文化散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>說明鳳梨酥融合傳統與現代，並寄寓對臺灣社會兼容並蓄的期許。</li><li><span class=\"tag\">字義</span>「摩登」是 modern 的音譯，意為現代、新式。</li><li><span class=\"tag\">寫法</span>從外形、內餡、歷史與飲食文化細密觀察，連結地方記憶。</li></ul></div></section>\n<section id=\"l09\"><h2>第九課　謝天 — 陳之藩</h2><div class=\"meta\"><b>文體：</b>說理散文　｜　<b>出處：</b>《陳之藩文集》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>「謝天」其實是感謝眾人的協助，提醒人要惜福感恩、功成不居。</li><li><span class=\"tag\">論證</span>重新詮釋傳統語詞，再用生活事例說明成功背後的眾人力量。</li></ul></div></section>\n<section id=\"l10\"><h2>第十課　貓的天堂 — 左拉著／本書編輯群譯</h2><div class=\"meta\"><b>文體：</b>翻譯寓言／小說　｜　<b>閱讀焦點：</b>幸福觀的轉變</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>透過安哥拉貓離家前後的經驗，思考舒適、自由與幸福的真正意義。</li><li><span class=\"tag\">閱讀</span>比較貓在主人家與外面生活時對「幸福」的不同定義。</li><li><span class=\"tag\">寓意</span>幸福不只有物質舒適，也包含選擇、尊嚴與對生活的主動感。</li></ul></div></section>\n<section id=\"self\"><h2>自學選文</h2><div class=\"block\"><h3>📌 三個主題</h3><ul><li><b>搜神抓鬼趣——六朝志怪小說選：</b>從志怪故事看古人對鬼神、因果與人情事理的想像。</li><li><b>放天燈是傳統，還是為山林製造更多垃圾？：</b>在傳統文化與環境保護之間思考平衡。</li><li><b>越南安妮：新移民的歌仔戲人生：</b>看新移民如何學習臺灣傳統藝術並建立認同。</li></ul></div></section>\n<a class=\"back\" href=\"index.html\">← 回總目錄</a></div></body></html>", "國文114上-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"><title>國文114上重點筆記</title><style>\n:root{--bg:#f7f6f2;--card:#fff;--ink:#2b2b2b;--muted:#6b6b6b;--accent:#a9432d;--accent2:#1f6f5c;--line:#e5e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;line-height:1.85}.wrap{max-width:850px;margin:auto;padding:32px 20px 80px}header{border-bottom:3px solid var(--accent);padding-bottom:14px}h1{color:var(--accent);font-size:1.8rem;margin:0 0 5px}.sub{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:24px 0}.btn{display:inline-block;padding:8px 14px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none}.back{color:var(--accent);text-decoration:none}\n</style></head><body><div class=\"wrap\"><header><h1>📖 國文114上（二年級上）重點筆記</h1><div class=\"sub\">與 115上課本內容共用</div></header><div class=\"card\"><h2>版本說明</h2><p>已核對資料夾中的課本檔名：114上與115上均為二年級上冊，課次與篇目一致：</p><p>〈田園之秋選〉、〈古詩選〉、〈下雨天，真好〉、〈愛蓮說〉、〈生命中的碎珠〉、〈鳥〉、〈張釋之執法〉、〈找尋失落的水源〉、〈一棵開花的樹〉、〈畫的哀傷〉，以及語文常識與自學選文。</p><p>為避免同一套教材產生兩份不同內容，本頁直接共用已完成的 115上逐課重點。請點下面連結進入：</p><p><a class=\"btn\" href=\"國文115-重點筆記.html\">開啟國文115上／114上共同重點</a></p></div><p><a class=\"back\" href=\"index.html\">← 回總目錄</a></p></div></body></html>", "國文114下-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"><title>國文114下重點筆記</title><style>\n:root{--bg:#f7f6f2;--card:#fff;--ink:#2b2b2b;--muted:#6b6b6b;--accent:#a9432d;--accent2:#1f6f5c;--line:#e5e2d8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;line-height:1.85}.wrap{max-width:960px;margin:auto;padding:26px 20px 80px}header{border-bottom:3px solid var(--accent);padding-bottom:14px}h1{color:var(--accent);margin:0 0 4px;font-size:1.8rem}.sub{color:var(--muted);font-size:.93rem}nav{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);z-index:3}nav a{display:inline-block;margin:3px 5px 3px 0;padding:3px 9px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--accent2);text-decoration:none;font-size:.84rem}h2{margin-top:40px;padding:8px 12px;border-left:6px solid var(--accent);border-radius:0 8px 8px 0;background:var(--card);font-size:1.3rem}.meta,.block{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 18px;margin:12px 0}.meta b{color:var(--accent2)}h3{color:var(--accent2);font-size:1.03rem;border-bottom:2px solid var(--accent2);padding-bottom:3px;margin-top:0}ul{padding-left:22px;margin:7px 0}li{margin:3px 0}.tag{display:inline-block;background:#fdf0e6;color:#8b3b25;border-radius:5px;padding:1px 8px;font-size:.8rem;font-weight:bold;margin-right:5px}.note{background:#fff8e8;border:1px solid #ecdfb9;border-radius:8px;padding:9px 13px;color:#6b5b3a;font-size:.9rem}.back{display:block;margin-top:36px;color:var(--accent);text-decoration:none}\n</style></head><body><div class=\"wrap\"><header><h1>📖 國文114下（二年級下）重點筆記</h1><div class=\"sub\">依 114 下國中國文課本逐課題解、作者與學習重點整理</div></header><nav><a href=\"#l01\">L01 運動家的風度</a><a href=\"#l02\">L02 木蘭詩</a><a href=\"#l03\">L03 管好舌頭</a><a href=\"#yu1\">語一</a><a href=\"#l04\">L04 康橋</a><a href=\"#l05\">L05 陋室銘</a><a href=\"#l06\">L06 森林</a><a href=\"#yu2\">語二</a><a href=\"#l07\">L07 飛魚</a><a href=\"#l08\">L08 空城計</a><a href=\"#l09\">L09 汨羅江神</a><a href=\"#l10\">L10 科幻</a><a href=\"#self\">自學</a></nav>\n\n<section id=\"l01\"><h2>第一課　運動家的風度 — 羅家倫</h2><div class=\"meta\"><b>出處：</b>《新人生觀》｜<b>文體：</b>演講稿／說理文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>由運動場上的公平競爭，推廣到人生應有的莊嚴、公正、協調與進取。</li><li><span class=\"tag\">精神</span>能服輸、超越勝敗，尊重對手與規則，不因一時成敗失去風度。</li><li><span class=\"tag\">寫法</span>善用事例與名言闡明抽象的人生道理。</li></ul></div></section>\n<section id=\"l02\"><h2>第二課　木蘭詩 — 佚名</h2><div class=\"meta\"><b>文體：</b>北朝樂府民歌／敘事詩</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>敘述木蘭女扮男裝、代父從軍、建立戰功後還鄉的故事，刻畫巾幗英雄兼具孝親與愛國的形象。</li><li><span class=\"tag\">樂府特色</span>句式長短不拘、可換韻、反覆吟詠，語言質樸自然。</li><li><span class=\"tag\">寫法</span>詳略得宜，戰爭場面略寫，木蘭出征前後與還鄉細節詳寫。</li></ul></div></section>\n<section id=\"l03\"><h2>第三課　管好舌頭 — 黃永武</h2><div class=\"meta\"><b>出處：</b>《生活美學・諧趣》｜<b>文體：</b>說理散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>說話前要慎思謹言，不逞口舌之快；言語應符合真實、善意與重要性。</li><li><span class=\"tag\">論證</span>以蘇格拉底「先學閉嘴，再學說話」的故事與正反論述，說明話多不如話好。</li><li><span class=\"tag\">實踐</span>不傳播道聽塗說、不中傷他人、不說無關緊要的話。</li></ul></div></section>\n<section id=\"yu1\"><h2>語文常識一　應用文：書信、便條</h2><div class=\"block\"><h3>📌 重點</h3><ul><li>書信要注意對象、內容、格式與稱謂，對長輩、平輩、晚輩須使用得體語氣。</li><li>書信基本結構包含稱謂、正文、祝頌語、署名與日期；信封須分清收信人、寄信人與地址。</li><li>便條文字簡短，須交代時間、地點、人物、事件與聯絡方式。</li></ul></div></section>\n<section id=\"l04\"><h2>第四課　我所知道的康橋 — 徐志摩</h2><div class=\"meta\"><b>出處：</b>《徐志摩全集》｜<b>文體：</b>抒情散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>回憶在康橋求學的美好經驗，抒發對康橋景物、文化與青春歲月的眷戀。</li><li><span class=\"tag\">寫法</span>景物描寫細膩，辭采華美；運用回文等修辭，形成活潑節奏。</li><li><span class=\"tag\">意義</span>康橋不只是地名，也象徵作者性靈開放、求知欲與自我意識的啟蒙。</li></ul></div></section>\n<section id=\"l05\"><h2>第五課　陋室銘 — 劉禹錫</h2><div class=\"meta\"><b>文體：</b>銘文／韻文　｜　<b>出處：</b>《劉禹錫集》</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>以陋室自況，說明真正重要的是品德與精神修養，而不是居所華美或物質富貴。</li><li><span class=\"tag\">名句</span>「斯是陋室，惟吾德馨」點明全篇中心。</li><li><span class=\"tag\">寫法</span>以山水起興、對比陋室與名居，首尾照應，並多用押韻與對偶。</li></ul></div></section>\n<section id=\"l06\"><h2>第六課　森林最優美的一天 — 徐仁修</h2><div class=\"meta\"><b>出處：</b>《荒野有歌》｜<b>文體：</b>自然觀察散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>深入觀察新店、烏來一帶低海拔森林，描寫野花與油桐花的色彩、香氣，喚起人對自然的珍惜。</li><li><span class=\"tag\">寫法</span>運用視覺、嗅覺等感官描寫，使森林景物具體生動。</li><li><span class=\"tag\">態度</span>親近自然、細心觀察，是自然教育與環境保育的起點。</li></ul></div></section>\n<section id=\"yu2\"><h2>語文常識二　應用文：題辭、柬帖</h2><div class=\"block\"><h3>📌 重點</h3><ul><li>題辭是寫在匾額、花圈、錦旗等物件上的精簡文辭，可用於慶賀、頌揚、勉勵、紀念或哀悼。</li><li>題辭須考量對象、目的、關係與場合，做到選詞貼切、文字典雅、音律和諧。</li><li>柬帖是邀請或通知的應用文，要交代時間、地點、事件、對象與落款。</li></ul></div></section>\n<section id=\"l07\"><h2>第七課　飛魚 — 廖鴻基</h2><div class=\"meta\"><b>出處：</b>《來自深海》｜<b>文體：</b>海洋文學／自然觀察散文</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>描寫阿美族人夜間捕飛魚及尋鯨過程的所見所感，展現海洋生命與人類文化的深層連結。</li><li><span class=\"tag\">作者</span>廖鴻基，臺灣海洋文學代表作家，長期投入鯨豚觀察與海洋保育。</li><li><span class=\"tag\">寫法</span>觀察細膩、多角度描寫，營造鮮明的海上畫面。</li></ul></div></section>\n<section id=\"l08\"><h2>第八課　空城計 — 羅貫中</h2><div class=\"meta\"><b>出處：</b>《三國演義》第九十五回｜<b>文體：</b>章回小說</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>孔明在西城兵力空虛時，以開城、撫琴等計策製造鎮定假象，令司馬懿疑忌退兵。</li><li><span class=\"tag\">人物</span>孔明處變不驚、慎謀能斷；司馬懿多疑而謹慎。</li><li><span class=\"tag\">寫法</span>以心理推測、對比與懸念安排情節，呈現智謀交鋒。</li></ul></div></section>\n<section id=\"l09\"><h2>第九課　汨羅江神 — 余光中</h2><div class=\"meta\"><b>出處：</b>《藕神》｜<b>文體：</b>現代詩</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">主旨</span>以國際龍舟節與汨羅江意象重探屈原精神，歌頌忠貞、愛國與堅持理想。</li><li><span class=\"tag\">意象</span>汨羅江、水流、龍舟與中外文人形成跨時空對話。</li><li><span class=\"tag\">考點</span>屈原投江、端午習俗、象徵與文化典故。</li></ul></div></section>\n<section id=\"l10\"><h2>第十課　科幻極短篇選 — 黃海等</h2><div class=\"meta\"><b>文體：</b>科幻小說／極短篇</div><div class=\"block\"><h3>📌 精簡重點</h3><ul><li><span class=\"tag\">科幻特色</span>以現有科學與科技為基礎，再用想像描寫未來或特殊情境，兼具文學性、科學性與哲學性。</li><li><span class=\"tag\">閱讀焦點</span>比較棋王與深藍電腦的情感反應及原因，思考科技與人類智慧的關係。</li><li><span class=\"tag\">閱讀方法</span>注意反轉、象徵與作者對未來的提問，不只停留在情節表面。</li></ul></div></section>\n<section id=\"self\"><h2>自學選文</h2><div class=\"block\"><h3>📌 三個主題</h3><ul><li><b>軼事瑣聞大觀園——唐宋筆記選：</b>從唐宋筆記的短篇記載，理解古人的思想、社會與文化。</li><li><b>面對假訊息，其實我可以這麼做！：</b>建立媒體識讀與查證訊息的能力。</li><li><b>進軍葛萊美的華人設計師——蕭青陽：</b>從轉換跑道與持續努力看生涯探索。</li></ul></div></section>\n<a class=\"back\" href=\"index.html\">← 回總目錄</a></div></body></html>", "國文115-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>國文 115上 · 二年級課本重點筆記</title>\n<style>\n  :root{--bg:#f7f6f2;--card:#fff;--ink:#2a2a2a;--muted:#6b6b6b;--accent:#b0422e;--accent2:#1f6f5c;--line:#e5e2d8;}\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85;}\n  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;}\n  header.top{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;}\n  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent);}\n  .sub{color:var(--muted);font-size:.95rem;}\n  nav.toc{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}\n  nav.toc a{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--accent2);font-size:.85rem;background:var(--card);}\n  nav.toc a:hover{border-color:var(--accent);color:var(--accent);}\n  h2.lesson{border-left:6px solid var(--accent);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;font-size:1.3rem;margin-top:42px;}\n  h2.lesson .no{color:var(--accent);}\n  .meta{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0 16px;font-size:.93rem;}\n  .meta b{color:var(--accent2);}\n  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;}\n  h3.quick{color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:4px;margin-top:0;font-size:1.02rem;}\n  h3.detail{color:var(--accent2);border-bottom:2px solid var(--accent2);padding-bottom:4px;margin-top:0;font-size:1.02rem;}\n  ul{margin:8px 0;padding-left:22px;} li{margin:4px 0;}\n  .tag{display:inline-block;background:#fdf0e6;color:#8a3b22;border-radius:6px;padding:2px 9px;font-size:.8rem;font-weight:700;margin-right:6px;}\n  .poem{background:#faf7ef;border:1px dashed #cdc3a6;border-radius:8px;padding:12px 16px;margin:10px 0;font-style:italic;color:#4a4438;}\n  .note{background:#fff8e8;border:1px solid #ecdfb9;border-radius:8px;padding:9px 13px;font-size:.9rem;color:#6b5b3a;}\n  .back{display:block;margin:40px 0 10px;color:var(--accent);text-decoration:none;}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>📖 國文 115上（二年級課本）重點筆記</h1>\n    <div class=\"sub\">依據 115 上 翰林版國中國文課本整理｜精簡重點＋詳實筆記</div>\n  </header>\n\n  <nav class=\"toc\">\n    <a href=\"#l01\">L01 田園之秋選</a><a href=\"#l02\">L02 古詩選</a><a href=\"#l03\">L03 下雨天，真好</a>\n    <a href=\"#yu1\">語文常識一</a><a href=\"#l04\">L04 愛蓮說</a><a href=\"#l05\">L05 生命中的碎珠</a>\n    <a href=\"#l06\">L06 鳥</a><a href=\"#yu2\">語文常識二</a><a href=\"#l07\">L07 張釋之執法</a>\n    <a href=\"#l08\">L08 找尋失落的水源</a><a href=\"#l09\">L09 一棵開花的樹</a><a href=\"#l10\">L10 畫的哀傷</a>\n    <a href=\"#self\">自學選文</a>\n  </nav>\n\n  <!-- L01 -->\n  <section id=\"l01\">\n    <h2 class=\"lesson\"><span class=\"no\">第一課</span> 田園之秋選 — 陳冠學</h2>\n    <div class=\"meta\"><b>出處：</b>《田園之秋》（以日期分篇的田園生活日記，本篇為九月七日）｜<b>文體：</b>記敘散文</div>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">主旨</span>記錄陌後一場「殘額雨」的過程，並抒發對田園生活與鄉土的熱愛。</li>\n        <li><span class=\"tag\">作者</span>陳冠學，臺灣屏東人，師大國文系出身，曾歸隱田園，作品充滿對土地的情感。</li>\n        <li><span class=\"tag\">寫法</span>以「時間先後」記下雨的開始→增強→最大→雨停，條理分明、描寫細膩。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>作者：</b>陳冠學，屏東人，國立臺灣師範大學國文系畢業，曾任教、出版之職，後歸隱田園，耕稼寫作，作品滿懷對鄉土的摯愛，著有《田園之秋》等。</p>\n      <p><b>題解：</b>《田園之秋》是作者記錄夏秋朝夕田園的日記式散文，此課選入「九月七日」一則。</p>\n      <p><b>內容重點：</b>開頭先說當日的工作，再由遠而近、由境到聲描寫午後雷陣雨——先見烏雲，接著閃電雷鳴，大雨傾盆而下，打在空中，最後雨過天晴、萬物清新。作者也寫雨帶給田園與自身的清涼與欣喜。</p>\n      <p><b>可考重點：</b>感官描寫（視覺、聽覺、觸覺）的運用、由天陰大雨至雨停的順序鋪敘。</p>\n    </div>\n  </section>\n\n  <!-- L02 -->\n  <section id=\"l02\">\n    <h2 class=\"lesson\"><span class=\"no\">第二課</span> 古詩選 — 迢迢牽牛星／慈烏夜啼</h2>\n    <div class=\"meta\"><b>一．〈迢迢牽牛星〉（佚名）</b> 五言古詩｜<b>二．〈慈烏夜啼〉（白居易）</b> 諷諭古詩</div>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">迢迢牽牛星</span>借牛郎、織女隔銀河相望的神話，抒寫人間有情人相隔而難見的離愁。</li>\n        <li><span class=\"tag\">慈烏夜啼</span>以慈烏（烏鴉）反哺寫孝親，勸人要謹記「子欲養而親不待」。漢 也</li>\n        <li><span class=\"tag\">疊字</span>迢迢、皎皎、纖纖、札札（牽牛）—增加音樂性。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>①迢迢牽牛星：</b>出自《古詩十九首》，是南朝梁最膾炙人口的家喻相思詩。全詩借「牛郎白衣二星隔河」歎人間相愛卻不得相聚。末兩句「盈盈一水間，脈脈不得語」更被譽為千古名句。</p>\n      <p><b>②慈烏夜啼：</b>白居易（字樂天，號樂天居士）以「′陶」（小烏鴉）爾啼謁時，感應親情。詩以「爍能反哺的烏」比頌孝子，相較今日「無孝」之慨，情真意切。</p>\n    </div>\n  </section>\n\n  <!-- L03 -->\n  <section id=\"l03\">\n    <h2 class=\"lesson\"><span class=\"no\">第三課</span> 下雨天，真好 — 琦君</h2>\n    <div class=\"meta\"><b>出處：</b>《紅紗燈》｜<b>文體：</b>懷舊抒情散文</div>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">主旨</span>以「下雨天」串起童年的溫馨記憶，透對父母、故鄉的深深懷念。</li>\n        <li><span class=\"tag\">作者</span>琦君，浙江永嘉人，散文名家，文風溫柔熚。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>篇旨：</b>童年住在浙江老家，「下雨天」總是與大人一同敘家常、聽雨、講故事的時光。成年後，雨猶是天還下雨，但兒時的溫馨種種雖已不在，仍以雨寄情，點出「下雨天，真好」的深層因緣——因為雨讓我想起家和童年。</p>\n      <p><b>賞析：</b>以「雨」作線索貫穿全文，「雨」成為情感情感的引子，藉景抒情，歷歷如畫，感人至深。</p>\n    </div>\n  </section>\n\n  <!-- 語一 -->\n  <section id=\"yu1\">\n    <h2 class=\"lesson\"><span class=\"no\">語文常識一</span> 語法（上）— 詞類</h2>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">字與詞</span>字是書寫最小單位；詞是能獨立運用的造句單位。</li>\n        <li><span class=\"tag\">含義</span>判斷詞性須看「在句中的意義與功能」，可一詞多性。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>一、字與詞：</b>字是文字形音單位，詞是最小可獨立造句的義單位；複詞由兩個或以上的字組成。</p>\n      <p><b>二、詞類分類：</b>實詞（名詞、動詞、形容詞、副詞、代詞）為主，虛詞（介詞、連詞、助詞、嘆詞）補助。</p>\n      <p><b>三、要點：</b>同一字可當不同詞性，須依上下文判斷，是詞性測驗的常考點。</p>\n    </div>\n  </section>\n\n  <!-- L04 -->\n  <section id=\"l04\">\n    <h2 class=\"lesson\"><span class=\"no\">第四課</span> 愛蓮說 — 周敦頤</h2>\n    <div class=\"meta\"><b>文體：</b>論說文（「說」體）｜<b>主旨：</b>借蓮喻君子不與世俗同議的高潔操守。</div>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">主旨</span>以「蓮」出淤泥而不染、不蔓不枝，喻君子清貞廉直、不隨俗不阿。</li>\n        <li><span class=\"tag\">作者</span>周敦頤，北宋，理學宗師，世稱濂溪先生。</li>\n        <li><span class=\"tag\">物象</span>蓮＝君子；菊＝隱逸之士；牡丹＝富貴媚俗。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>作者：</b>周敦頤，字茂叔，北宋道州營道人，為宋理學之創，曾在廬山築濂溪書院講學，世稱「濂溪先生」。</p>\n      <p><b>「說」體：</b>「說」是議論辨理的古文體裁，常用詠物言志，如韓愈〈馬說〉、本篇等。</p>\n      <p><b>主旨：</b>文章先以「晉陶淵明獨愛菊、世人盛愛牡丹」與「余青蓮」相對照，既詠蓮之「出淤泥而不染、中通外直、不聲不擺」，又以「出淤泥而不染」象君子的操守高潔。收尾以（君子）之慨，點出對理想人格之美立與對世俗流的感喟。</p>\n    </div>\n  </section>\n\n  <!-- L05 -->\n  <section id=\"l05\">\n    <h2 class=\"lesson\"><span class=\"no\">第五課</span> 生命中的碎珠 — 陳幸蕙</h2>\n    <div class=\"meta\"><b>文體：</b>抒情說理散文｜<b>主旨：</b>善用零碎時間，積少蕋多。</div>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">題目</span>「碎珠」指零碎、容易被忽略的時間。</li>\n        <li><span class=\"tag\">主旨</span>若能重視並運用這些零碎時間，可積少成多、豐富人生。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>主旨：</b>生活像一串被散落的碎珠；零碎的時刻若善加利用，聚沙成塔，就可能成為生命躍起的關鍵。作者以「碎珠」比喻瑣碎時間，勸人珍惜把握。</p>\n      <p><b>寫作特色：</b>設喻生動、「碎珠」的意象一以貫之，說理委婉而切身。</p>\n    </div>\n  </section>\n\n  <!-- L06 -->\n  <section id=\"l06\">\n    <h2 class=\"lesson\"><span class=\"no\">第六課</span> 鳥 — 梁實秋</h2>\n    <div class=\"meta\"><b>出處：</b>《雅舍小品》｜<b>文體：</b>詠物散文</div>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">主旨</span>描寫各種鳥的姿態鳴聲，並以籠中苛鳥對照自然之鳥，寄寓對自由的嚮往。</li>\n        <li><span class=\"tag\">作者</span>梁實秋，文散文小品大師，觀察細、言語幽默。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>內容：</b>本文寫作者所見的「鳥」，從鳥的形貌、叫聲，到詠鳥「不願受縛」的本性，以「鰲中鳥」的苦與「空中鳥」的自由對比，寄託自己對飽逸與自由的體悟。</p>\n      <p><b>寫法：</b>擅以極簡白描，以物寫心；「借景抒情」之外亦接物言志。</p>\n    </div>\n  </section>\n\n  <!-- 語二 -->\n  <section id=\"yu2\">\n    <h2 class=\"lesson\"><span class=\"no\">語文常識二</span> 語法（下）— 句子</h2>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">成分</span>主語＋環語為句之骨幹，可補定狀。</li>\n        <li><span class=\"tag\">句型</span>敘述、狀態、判斷、存姂四類。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>句子成分：</b>主語（誰／什麼）與環語（做什麼／是什麼／怎麼）構成句子中心。</p>\n      <p><b>四大句型：</b>①敘事句（以動作張成）、②表態句（描寫狀態）、③判斷句（「是」格）、④存姂句（「有／在」再）。了解句型有助於文意與文法判讀。</p>\n    </div>\n  </section>\n\n  <!-- L07 -->\n  <section id=\"l07\">\n    <h2 class=\"lesson\"><span class=\"no\">第七課</span> 張釋之執法 — 司馬遷</h2>\n    <div class=\"meta\"><b>出處：</b>《史記》｜<b>人物：</b>張釋之（朝庭尉）｜<b>主旨：</b>執法如山，不畏君威。</div>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">主旨</span>張釋之身邢廷尉（掌刑獄），丈文帝欲駿以允刑，釋之以法相規，貌「執法」勝於「聽君」。 </li>\n        <li><span class=\"tag\">原文</span>「今罰若是，何以示後世？天下公義，不可予也」，彰顯執法之正。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p><b>作者：</b>司馬遷，西漢太史令，著《史記》（中國首部紀傳體通史）。</p>\n      <p><b>本篇：</b>敘「白招討『驚駕』」一案，漢文帝公威暴行，命張釋之其審。張竟援以正法、秉公要「同刑同罪」，連該尉刁進而詳申，文帝最後醒寤，聽納張釋之之諫，重刑以法相映，流傳為依法執法、不畏君主的楷模。</p>\n    </div>\n  </section>\n\n  <!-- L08 -->\n  <section id=\"l08\">\n    <h2 class=\"lesson\"><span class=\"no\">第八課</span> 找尋失落的水源 — 亞榮隆·撒可努</h2>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">主旨</span>藉探尋水源的遊程，寫人與自然生命之源不可分割的關係與愛惜。</li>\n        <li><span class=\"tag\">意象</span>「水」為生命源頭之隱喻，象環境與記憶。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p>課文以遠步尋水為經，實串自然之美。「水源」既指山川田野的生命之泉，也暗喻許多遺落在都市中的珍貴事物。文筆清雋，寓意深遠。</p>\n    </div>\n  </section>\n\n  <!-- L09 -->\n  <section id=\"l09\">\n    <h2 class=\"lesson\"><span class=\"no\">第九課</span> 一棵開花的樹 — 席慕蓉</h2>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">詩旨</span>借「願化作一棵開花的樹，開在自己命中」寫愛的願望與漦麗的無悔。</li>\n        <li><span class=\"tag\">設喻</span>以「樹」喻意中人，「花」喻深情，綿密。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p>本文為現代新詩。詩人由「我在佛前許願／化作一棵樹／開花在最愛的走廊」起，寫出願在理想中盛開、不畏凋謝的深情。以「樹」與「花」刻畫期待與撫情，簡潔而雋永。</p>\n    </div>\n  </section>\n\n  <!-- L10 -->\n  <section id=\"l10\">\n    <h2 class=\"lesson\"><span class=\"no\">第十課</span> 畫的哀傷 — 國木田獨步</h2>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 精簡重點</h3>\n      <ul>\n        <li><span class=\"tag\">主旨</span>由「畫」入題，寫「畫」出所燒的一切與殞落的哀。</li>\n        <li><span class=\"tag\">象徵</span>「畫」喻短ながら繁盛的生命之美。</li>\n      </ul>\n    </div>\n    <div class=\"block\">\n      <h3 class=\"detail\">📝 詳實筆記</h3>\n      <p>課文寫一幅畫裡的生命如何盛又如何殘，進入「畫」的對象與根本的哀愁，藉物懷人，詩意深長。</p>\n    </div>\n  </section>\n\n  <!-- 自學選文 -->\n  <section id=\"self\">\n    <h2 class=\"lesson\"><span class=\"no\">自學選文</span> 作品引言與重點</h2>\n    <div class=\"block\">\n      <h3 class=\"quick\">📌 六朝名士畫廊 — 世說新語選</h3>\n      <p>魏晉「志人」小說的代表，呈現魏晉名士清談風流與人物風骨，文短意潔。</p>\n      <h3 class=\"quick\">📌 一團人生／安藤忠雄</h3>\n      <p>〈一團人生〉勉人生應熱情積極；〈安藤忠雄〉以自學成家的例子，說明「學習不惟正規」，靠自愛與努力同樣可成極致。</p>\n    </div>\n  </section>\n\n  <a class=\"back\" href=\"index.html\">← 回總目錄</a>\n</div>\n</body>\n</html>", "數學-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>數學課本重點筆記（113–115）</title>\n<style>\n  :root{--bg:#f7f6f2;--card:#fff;--ink:#2a2a2a;--muted:#6b6b6b;--accent:#b0422e;--accent2:#1f6f5c;--line:#e5e2d8;}\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;}\n  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;}\n  header.top{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;}\n  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent);}\n  .sub{color:var(--muted);font-size:.95rem;}\n  nav.toc{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}\n  nav.toc a{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--accent2);font-size:.85rem;background:var(--card);}\n  nav.toc a:hover{border-color:var(--accent);color:var(--accent);}\n  h2.book{border-left:6px solid var(--accent);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;font-size:1.3rem;margin-top:40px;}\n  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;}\n  h3{color:var(--accent2);margin:10px 0 6px;font-size:1.05rem;}\n  table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--card);font-size:.92rem;}\n  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}\n  th{background:#f1eee4;color:var(--accent2);}\n  ul{margin:6px 0;padding-left:22px;} li{margin:3px 0;}\n  .back{display:block;margin:40px 0 10px;color:var(--accent);text-decoration:none;}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>📐 數學課本重點筆記（113–115 翰林）</h1>\n    <div class=\"sub\">一年級（113）→ 二年級（114→115）→ 三年級（115）｜依課本章節、已核對課本目次</div>\n  </header>\n  <nav class=\"toc\">\n    <a href=\"#y1u\">一年級上</a><a href=\"#y1d\">一年級下</a><a href=\"#y2u\">二年級上</a><a href=\"#y2d\">二年級下</a><a href=\"#y3u\">三年級上</a>\n  </nav>\n\n  <section id=\"y1u\">\n    <h2 class=\"book\">一年級上（113）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>數與數線</td><td>正負數、數線與絕對值；正負數加減、乘除運算；指數記法與科學記號。奠定整數與運算秩序的基礎。</td></tr>\n        <tr><td>第2章</td><td>分數與四則運算</td><td>質因數分解、公因數公倍數；分數的加減乘除與四則混合運算，連結倍數與約分的概念。</td></tr>\n        <tr><td>第3章</td><td>一元一次方程式</td><td>式子的簡記與化簡、等量公理、解一元一次方程式及其應用問題（列式求解）。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"y1d\">\n    <h2 class=\"book\">一年級（下）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>二元一次聯立方程式</td><td>二元一次方程式與聯立方程式的解；代入消去法、加減消去法與應用問題（已核對課本）。</td></tr>\n        <tr><td>第2章</td><td>直角座標與二元一次方程式的圖形</td><td>直角座標平面；二元一次方程式的圖形為一直線，與斜率概念。</td></tr>\n        <tr><td>第3章</td><td>比例</td><td>比與比值、比例式、正比與反比的關係及其應用。</td></tr>\n        <tr><td>第4章</td><td>一元一次不等式</td><td>不等式的性質、一元一次不等式與其解、數線表示。</td></tr>\n        <tr><td>第5章</td><td>統計圖表與統計量</td><td>次數分配、累積次數；平均數、中位數、眾數與全距。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"y2u\">\n    <h2 class=\"book\">二年級（上．114）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>乘法公式與多項式</td><td>和差積、完全平方式、平方差公式；多項式的加減乘除。</td></tr>\n        <tr><td>第2章</td><td>二次方根與畢氏定理</td><td>平方根、根式的化簡；畢氏定理與其應用（直角三角形的三邊關係）。</td></tr>\n        <tr><td>第3章</td><td>因式分解</td><td>提公因式、利用乘法公式與十字交乘法分解因式。</td></tr>\n        <tr><td>第4章</td><td>一元二次方程式</td><td>配方法、因式分解法、公式解求解及應用。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"y2d\">\n    <h2 class=\"book\">二年級（下．114）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>數列與級數</td><td>等差數列與等差級數、等差中項；等比數列與等比級數。</td></tr>\n        <tr><td>第2章</td><td>函數及其圖形</td><td>線性函數、函數圖形、常數函數與其應用。</td></tr>\n        <tr><td>第3章</td><td>三角形的基本性質</td><td>三角形邊角、全等性質（SSS/SAS/ASA/AAS/RHS）、外角定理。</td></tr>\n        <tr><td>第4章</td><td>平行與四邊形</td><td>平行線與截線、平行四邊形的性質與判別、梯形與菱形等。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"y3u\">\n    <h2 class=\"book\">三年級（上．115）</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>相似形</td><td>比例線段、相似三角形判別（AA/SAS/SSS）與應用。</td></tr>\n        <tr><td>第2章</td><td>圓</td><td>圓的性質、切線、弦與弧、圓內外角與扇形面積。</td></tr>\n        <tr><td>第3章</td><td>幾何與證明</td><td>推理證明的基本性質、邏輯推理、幾何證明技巧。</td></tr>\n        <tr><td>第4章</td><td>統計與機率</td><td>資料的整理與解讀、機率的基本概念與應用。</td></tr>\n        <tr><td>第5章</td><td>二次函數與直線</td><td>二次函數圖形、拋物線、二次函數與一元二次方程式的關係。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <a class=\"back\" href=\"index.html\">← 回總目錄</a>\n</div>\n</body>\n</html>", "會考考古題-重點整理.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>歷屆會考考古題重點整理（110–115）</title>\n<style>\n  :root{--bg:#f7f6f2;--card:#fff;--ink:#2a2a2a;--muted:#6b6b6b;--accent:#b0422e;--accent2:#1f6f5c;--line:#e5e2d8;}\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;}\n  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;}\n  header.top{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;}\n  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent);}\n  .sub{color:var(--muted);font-size:.95rem;}\n  nav.toc{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}\n  nav.toc a{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--accent2);font-size:.85rem;background:var(--card);}\n  nav.toc a:hover{border-color:var(--accent);color:var(--accent);}\n  h2.subj{border-left:6px solid var(--accent);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;font-size:1.3rem;margin-top:40px;}\n  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;}\n  table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--card);font-size:.9rem;}\n  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}\n  th{background:#f1eee4;color:var(--accent2);}\n  ul{margin:6px 0;padding-left:22px;} li{margin:3px 0;}\n  .back{display:block;margin:40px 0 10px;color:var(--accent);text-decoration:none;}\n  .note{background:#fff8e8;border:1px solid #ecdfb9;border-radius:8px;padding:10px 14px;font-size:.9rem;color:#6b5b3a;}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>📝 歷屆會考考古題重點整理（110–115）</h1>\n    <div class=\"sub\">國文・數學・社會・自然・英文｜題型結構＋命題取向＋準備策略</div>\n  </header>\n  <nav class=\"toc\">\n    <a href=\"#cn\">國文</a><a href=\"#ma\">數學</a><a href=\"#so\">社會</a><a href=\"#sc\">自然</a><a href=\"#en\">英文</a><a href=\"#strategy\">準備策略</a>\n  </nav>\n\n  <div class=\"note\">說明：本總覽整理「國中教育會考」110–115 年 5 科題本結構與命題取向。題數與題型依題本實際抽樣核對（國文、社會已翻頁確認），命題取向為一般性概覽。</div>\n\n  <section id=\"cn\">\n    <h2 class=\"subj\">國文</h2>\n    <div class=\"block\">\n      <p><b>題本結構：</b>單題（約 23 題，字音字形、字義、成語、修辭、文意、標點、造字等）＋ 題組／閱讀題（課外長文閱讀、古典詩文判讀）。全卷約 40+ 題。</p>\n      <p><b>命題取向：</b>以「閱讀理解」為核心，大量考文言文與白話文閱讀後的文意判讀；單題重基礎語文能力（形音義、修辭、標點、造字）。</p>\n      <p><b>常見題材（115 實例）：</b>「即」字義辨別、料理文化交流、造字「鬲」、散文標點、錯別字、讀音、古詩《第十二夜》《烘書偈》《魏三體石經》、牛郎織女等。</p>\n      <p><b>準備重點：</b>①國字注音形音義＋成語；②文言文與詩詞翻譯；③閱讀理解策略（抓主旨、推論、找出「下列何者最恰當」的題眼）。</p>\n    </div>\n  </section>\n\n  <section id=\"ma\">\n    <h2 class=\"subj\">數學</h2>\n    <div class=\"block\">\n      <p><b>題本結構：</b>選擇題＋非選擇題（作圖/證明/應用問題）。基礎題約 6-8 成，其餘為統整與應用。</p>\n      <p><b>命題取向：</b>涵蓋數與量、代數（方程式、不等式、多項式）、幾何（全等相似、圓）、統計與機率。重視計算正確度與讀題。</p>\n      <p><b>準備重點：</b>①每章基礎公式與運算；②幾何證明與尺規作圖；③應用題列式；④時間分配（選擇題求快，非選求準）。</p>\n    </div>\n  </section>\n\n  <section id=\"so\">\n    <h2 class=\"subj\">社會</h2>\n    <div class=\"block\">\n      <p><b>題本結構（115）：</b>單題（約 43 題）＋ 題組。公民／地理／歷史三科混合出題。</p>\n      <p><b>命題取向：</b>以「資料判讀」為核心——圖表、地圖、統計、漫畫、新聞與文獻判讀；考時事與空間/時間思維。</p>\n      <p><b>常見題材（115 實例）：</b>2024 颱風豪雨農損、日本外籍移工政策、農場衛星影像、平埔族生活空間、世界都市化與人均所得統計、斯巴達「殺嬰」制度、漫畫經濟大恐慌等。</p>\n      <p><b>準備重點：</b>①公民法律與經濟概念；②地理地圖與統計判讀；③歷史時間軸與事件因果；④特別會「圖表與漫畫」題。社會科是題數最多、最重素養的一科。</p>\n    </div>\n  </section>\n\n  <section id=\"sc\">\n    <h2 class=\"subj\">自然</h2>\n    <div class=\"block\">\n      <p><b>題本結構：</b>選擇題居多（約 50 題），涵蓋生物、理化、地科三大領域。</p>\n      <p><b>命題取向：</b>科學概念＋實驗與探究、圖表判讀、生活情境（天氣、能源、環境）。</p>\n      <p><b>準備重點：</b>①生物生命現象與遺傳生態；②理化力光電磁與化學反應；③地科板塊、天象、氣候；④實驗步驟與變因操控。</p>\n    </div>\n  </section>\n\n  <section id=\"en\">\n    <h2 class=\"subj\">英文</h2>\n    <div class=\"block\">\n      <p><b>題本結構：</b>聽力測驗＋ 閱讀測驗（單題文法字彙、克漏字、閱讀測驗）。</p>\n      <p><b>命題取向：</b>詞彙語法基礎＋閱讀理解，聽力取自日常對話情境。</p>\n      <p><b>準備重點：</b>①核心單字與文法（時態、助動詞、從屬連接詞、關係子句）；②閱讀長文抓訊息；③聽力日常對話題型。</p>\n    </div>\n  </section>\n\n  <section id=\"strategy\">\n    <h2 class=\"subj\">整體準備策略</h2>\n    <div class=\"block\">\n      <ul>\n        <li><b>先做近三年（113–115）題本</b>，掌握眼前命題與難度。</li>\n        <li><b>題本不要只寫答案</b>：每一題都回顧「考的是哪個概念」，錯題標記回課本補強。</li>\n        <li><b>社會、自然特別練「圖表與文字判讀」</b>——這是課本最常考的門檻。</li>\n        <li><b>國文、英文吃「閱讀速度」</b>：每天固定做文言文＋英文短文閱讀。</li>\n        <li><b>數學做好非選擇與應用題</b>：過程分很重，別只對答案。</li>\n        <li>考古題用來「找弱點」，不是用來「背答案」；最後回歸課本重點筆記統整。</li>\n      </ul>\n    </div>\n  </section>\n\n  <a class=\"back\" href=\"index.html\">← 回總目錄</a>\n</div>\n</body>\n</html>", "社會-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>社會課本重點筆記（113–115）</title>\n<style>\n  :root{--bg:#f7f6f2;--card:#fff;--ink:#2a2a2a;--muted:#6b6b6b;--accent:#b0422e;--accent2:#1f6f5c;--line:#e5e2d8;}\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;}\n  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;}\n  header.top{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;}\n  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent);}\n  .sub{color:var(--muted);font-size:.95rem;}\n  nav.toc{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}\n  nav.toc a{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--accent2);font-size:.85rem;background:var(--card);}\n  nav.toc a:hover{border-color:var(--accent);color:var(--accent);}\n  h2.subj{border-left:6px solid var(--accent);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;font-size:1.35rem;margin-top:40px;}\n  h3.vol{color:var(--accent2);margin:18px 0 6px;font-size:1.05rem;}\n  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;}\n  table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--card);font-size:.92rem;}\n  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}\n  th{background:#f1eee4;color:var(--accent2);}\n  ul{margin:6px 0;padding-left:22px;} li{margin:3px 0;}\n  .back{display:block;margin:40px 0 10px;color:var(--accent);text-decoration:none;}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>🌏 社會課本重點筆記（113–115 翰林）</h1>\n    <div class=\"sub\">公民・地理・歷史｜課名依課本 PDF 檔名核對</div>\n  </header>\n  <nav class=\"toc\">\n    <a href=\"#civ\">公民</a><a href=\"#geo\">地理</a><a href=\"#his\">歷史</a>\n  </nav>\n\n  <!-- 公民 -->\n  <section id=\"civ\">\n    <h2 class=\"subj\">公民（社會／公民素養）</h2>\n\n    <h3 class=\"vol\">一年級上（113）— 個人與家庭</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th><th>核心</th></tr>\n        <tr><td>L01</td><td>公民與公民德性</td><td>公民的意義、現代公民應具備的德性與素養。</td></tr>\n        <tr><td>L02</td><td>人性尊嚴與人權保障</td><td>人性尊嚴的內涵、基本人權的保障。</td></tr>\n        <tr><td>L03</td><td>家庭生活</td><td>家庭的型態、功能與家人關係的經營。</td></tr>\n        <tr><td>L04</td><td>變遷中的家庭</td><td>家庭型態的變遷、現代家庭的挑戰。</td></tr>\n        <tr><td>L05</td><td>學生權利與校園生活</td><td>學生權利、校園民主與校規。</td></tr>\n        <tr><td>L06</td><td>部落與公民參與</td><td>部落/社區意識、公民參與的途徑。</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">一年級下（113）— 社會與公共生活</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th><th>核心</th></tr>\n        <tr><td>L01</td><td>多元文化</td><td>文化的內涵與多元文化的尊重。</td></tr>\n        <tr><td>L02</td><td>社會規範</td><td>風俗、道德、法律等社會規範的功能。</td></tr>\n        <tr><td>L03</td><td>團體與志願結社</td><td>團體的類型、志願結社與公民社會。</td></tr>\n        <tr><td>L04</td><td>公共意見</td><td>公共意見的形成、媒體與民意。</td></tr>\n        <tr><td>L05</td><td>公平正義</td><td>公平正義的意涵與資源分配。</td></tr>\n        <tr><td>L06</td><td>社會安全與國家責任</td><td>社會安全制度、國家對人民的照顧責任。</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">二年級上（114）— 國家與政府</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th><th>核心</th></tr>\n        <tr><td>L01</td><td>國家與民主政治</td><td>國家的組成要素、民主政治的基本原則。</td></tr>\n        <tr><td>L02</td><td>憲法與權利保障</td><td>憲法的地位、人民基本權利的保障。</td></tr>\n        <tr><td>L03</td><td>法治與權力分立</td><td>法治的意義、中央政府的權力分立制衡。</td></tr>\n        <tr><td>L04</td><td>中央政府</td><td>總統、行政、立法、司法、考試、監察院的職權。</td></tr>\n        <tr><td>L05</td><td>地方政府</td><td>地方政府的組織與自治。</td></tr>\n        <tr><td>L06</td><td>政治參與</td><td>選舉、公民投票與政治參與的途徑。</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">二年級下（114）— 法律與生活</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th><th>核心</th></tr>\n        <tr><td>L01</td><td>生活中的契約</td><td>契約的成立、效力與履行。</td></tr>\n        <tr><td>L02</td><td>民事糾紛的解決</td><td>民事責任、訴訟與和解調解。</td></tr>\n        <tr><td>L03</td><td>刑法與刑罰</td><td>犯罪構成要件、刑罰種類。</td></tr>\n        <tr><td>L04</td><td>刑事案件的追訴</td><td>偵查、起訴、審判與執行。</td></tr>\n        <tr><td>L05</td><td>行政法規與行政救濟</td><td>行政法規、訴願與行政訴訟。</td></tr>\n        <tr><td>L06</td><td>兒少權益的維護</td><td>兒童及少年權益的保障機制。</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">三年級上（115）— 經濟生活</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th><th>核心</th></tr>\n        <tr><td>L01</td><td>選擇與消費</td><td>機會成本、理性消費與消費者權益。</td></tr>\n        <tr><td>L02</td><td>生產與生產資源</td><td>生產要素、生產力與分工。</td></tr>\n        <tr><td>L03</td><td>市場與競爭</td><td>供需法則、市場型態與競爭。</td></tr>\n        <tr><td>L04</td><td>勞動參與</td><td>勞動市場、薪資與勞工權益。</td></tr>\n        <tr><td>L05</td><td>貨幣的使用</td><td>貨幣的功能、金融機構與儲蓄。</td></tr>\n        <tr><td>L06</td><td>國際貿易與外幣</td><td>國際貿易、匯率與外匯。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <!-- 地理 -->\n  <section id=\"geo\">\n    <h2 class=\"subj\">地理（空間思維）</h2>\n\n    <h3 class=\"vol\">一年級上（113）— 臺灣自然環境</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>認識位置與地圖</td></tr>\n        <tr><td>L02</td><td>世界中的臺灣</td></tr>\n        <tr><td>L03</td><td>地形</td></tr>\n        <tr><td>L04</td><td>海岸與島嶼</td></tr>\n        <tr><td>L05</td><td>天氣與氣候</td></tr>\n        <tr><td>L06</td><td>水文</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">一年級下（113）— 臺灣人文與區域</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>人口成長與分布</td></tr>\n        <tr><td>L02</td><td>人口組成與族群文化</td></tr>\n        <tr><td>L03</td><td>第一級產業</td></tr>\n        <tr><td>L04</td><td>第二、三級產業</td></tr>\n        <tr><td>L05</td><td>聚落體系與都市發展</td></tr>\n        <tr><td>L06</td><td>區域發展與差異</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">二年級上（114）— 中國與東北亞</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>中國的地形／氣候／人口／經濟發展與全球關連</td></tr>\n        <tr><td>L02</td><td>東北亞（自然環境與文化、經濟發展與挑戰）</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">二年級下（114）— 亞洲與非洲</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>東南亞</td></tr>\n        <tr><td>L02</td><td>南亞</td></tr>\n        <tr><td>L03</td><td>西亞與北非的自然環境與文化</td></tr>\n        <tr><td>L04</td><td>西亞與北非的衝突與經濟發展</td></tr>\n        <tr><td>L05</td><td>漠南非洲的自然環境與文化</td></tr>\n        <tr><td>L06</td><td>漠南非洲的產業與經濟發展</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">三年級上（115）— 世界地理</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>歐洲概述</td></tr>\n        <tr><td>L02</td><td>歐洲區域特色與俄羅斯</td></tr>\n        <tr><td>L03</td><td>北美洲</td></tr>\n        <tr><td>L04</td><td>中南美洲</td></tr>\n        <tr><td>L05</td><td>大洋洲</td></tr>\n        <tr><td>L06</td><td>兩極地區與全球氣候變遷</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <!-- 歷史 -->\n  <section id=\"his\">\n    <h2 class=\"subj\">歷史（時間脈絡）</h2>\n\n    <h3 class=\"vol\">一年級上（113）— 臺灣史（史前～清領）</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>史前臺灣與原住民文化</td></tr>\n        <tr><td>L02</td><td>大航海時代各方勢力的競逐</td></tr>\n        <tr><td>L03</td><td>大航海時代臺灣原住民與外來者</td></tr>\n        <tr><td>L04</td><td>清帝國統治政策的變遷</td></tr>\n        <tr><td>L05</td><td>清帝國時期農商業的發展</td></tr>\n        <tr><td>L06</td><td>清帝國時期社會文化的變遷</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">一年級下（113）— 臺灣史（日治～戰後）</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>日治時期的政治</td></tr>\n        <tr><td>L02</td><td>日治時期的經濟</td></tr>\n        <tr><td>L03</td><td>日治時期的社會與文化</td></tr>\n        <tr><td>L04</td><td>戰後臺灣的政治</td></tr>\n        <tr><td>L05</td><td>戰後臺灣的外交</td></tr>\n        <tr><td>L06</td><td>戰後臺灣的經濟與社會</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">二年級上（114）— 中國史（上古～清末）</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>商周至隋唐時期的國家與社會</td></tr>\n        <tr><td>L02</td><td>商周至隋唐時期的民族與文化</td></tr>\n        <tr><td>L03</td><td>宋元多民族並立的時期</td></tr>\n        <tr><td>L04</td><td>明清時期東亞世界的變動</td></tr>\n        <tr><td>L05</td><td>西力衝擊下的東亞世界</td></tr>\n        <tr><td>L06</td><td>清末變局與社會文化的變遷</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">二年級下（114）— 中國與東亞（民國～當代）</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>中華民國的建立</td></tr>\n        <tr><td>L02</td><td>舊傳統與新思潮</td></tr>\n        <tr><td>L03</td><td>現代國家的挑戰</td></tr>\n        <tr><td>L04</td><td>現代國家的變局</td></tr>\n        <tr><td>L05</td><td>共黨政權在中國</td></tr>\n        <tr><td>L06</td><td>當代東亞的局勢</td></tr>\n      </table>\n    </div>\n\n    <h3 class=\"vol\">三年級上（115）— 世界史</h3>\n    <div class=\"block\">\n      <table>\n        <tr><th>課</th><th>主題</th></tr>\n        <tr><td>L01</td><td>西亞與非洲的古文明</td></tr>\n        <tr><td>L02</td><td>古希臘羅馬文化的開展</td></tr>\n        <tr><td>L03</td><td>普世宗教的發展</td></tr>\n        <tr><td>L04</td><td>近代歐洲與多元世界</td></tr>\n        <tr><td>L05</td><td>近代歐洲的變革</td></tr>\n        <tr><td>L06</td><td>現代國家的建立</td></tr>\n        <tr><td>補充</td><td>工業革命（3下補充教材）</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <a class=\"back\" href=\"index.html\">← 回總目錄</a>\n</div>\n</body>\n</html>", "自然-重點筆記.html": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>自然課本重點筆記（113–115）</title>\n<style>\n  :root{--bg:#f7f6f2;--card:#fff;--ink:#2a2a2a;--muted:#6b6b6b;--accent:#b0422e;--accent2:#1f6f5c;--line:#e5e2d8;}\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;font-family:\"Microsoft JhengHei\",\"Noto Sans TC\",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;}\n  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px;}\n  header.top{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;}\n  h1{margin:0 0 4px;font-size:1.8rem;color:var(--accent);}\n  .sub{color:var(--muted);font-size:.95rem;}\n  nav.toc{position:sticky;top:0;background:rgba(247,246,242,.97);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}\n  nav.toc a{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--accent2);font-size:.85rem;background:var(--card);}\n  nav.toc a:hover{border-color:var(--accent);color:var(--accent);}\n  h2.book{border-left:6px solid var(--accent);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;font-size:1.3rem;margin-top:40px;}\n  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;}\n  table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--card);font-size:.92rem;}\n  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}\n  th{background:#f1eee4;color:var(--accent2);}\n  ul{margin:6px 0;padding-left:22px;} li{margin:3px 0;}\n  .back{display:block;margin:40px 0 10px;color:var(--accent);text-decoration:none;}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>🔬 自然課本重點筆記（113–115 翰林）</h1>\n    <div class=\"sub\">一年級生物（113）→ 二年級理化（114）→ 三年級理化＋地科（115）｜章節依課本檔名與目次核對</div>\n  </header>\n  <nav class=\"toc\">\n    <a href=\"#b1u\">一上（生物）</a><a href=\"#b1d\">一下（生物）</a><a href=\"#p2u\">二上（理化）</a><a href=\"#p2d\">二下（理化）</a><a href=\"#e3u\">三上（理化＋地科）</a>\n  </nav>\n\n  <section id=\"b1u\">\n    <h2 class=\"book\">一年級上（113）— 生物</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>緒論</td><td>科學方法</td><td>觀察、提出問題、假設、實驗、結論的科學探究流程。</td></tr>\n        <tr><td>第1章</td><td>生命的特性</td><td>生命現象（1-1）、細胞與顯微鏡（1-2）、細胞所需的物質（1-3）、從細胞到個體（1-4）。</td></tr>\n        <tr><td>第2章</td><td>養分</td><td>食物中的養分、酵素與消化、植物如何製造養分（光合作用）。</td></tr>\n        <tr><td>第3章</td><td>生物的運輸與防禦</td><td>植物的運輸構造（根莖葉）、動物的循環系統、免疫防禦。</td></tr>\n        <tr><td>第4章</td><td>生物的協調作用</td><td>神經系統、內分泌系統、植物的感應與行為。</td></tr>\n        <tr><td>第5章</td><td>生物的恆定性</td><td>恆定性的意義、體溫與血糖的調節、排泄。</td></tr>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"b1d\">\n    <h2 class=\"book\">一年級下（113）— 生物</h2>\n    <div class=\"block\">\n      <table>\n        <tr><th>章</th><th>主題</th><th>核心重點</th></tr>\n        <tr><td>第1章</td><td>生殖</td
